k the history with [Material Tracing], [Check Results] and [Inspection Report].","생산유형별 공정 구성(공정명·공장·실적등록/QC 필수·최종공정·배치여부·ERP 공정 등)과 공정준비사항·설비설정을 관리합니다.":"Manage process configuration by production type (process name, plant, result registration/QC required, final process, batch flag, ERP process, etc.), along with process preparation items and equipment settings.","① 구분(제조/포장)과 분말/액상/연질을 선택하고 [검색]을 누릅니다.":"① Select the category (Manufacturing/Packaging) and powder/liquid/softgel, then click [Search].","③ 좌측 생산유형 목록에서 유형을 선택합니다.":"③ Select a type from the production type list on the left.","④ 우측에서 공정을 [추가]하고 속성을 입력한 뒤 [저장]합니다.":"④ On the right, [Add] a process, enter its attributes, and click [Save].","④ [공정준비사항]·[설비설정] 열의 등록으로 상세를 설정합니다.":"④ Configure details via the register links in the [Process Preparation] and [Equipment Settings] columns.","공정명과 공장은 빈 값으로 저장할 수 없습니다.":"Process name and plant cannot be saved empty.","신규 추가한 공정은 저장 후 준비사항·설비설정을 등록할 수 있습니다.":"For newly added processes, preparation items and equipment settings can be registered after saving.","생산유형의 공정별로 작업 전 점검사항(분류·점검사항·체크필수·순서)을 등록하고 관리합니다.":"Register and manage pre-work checklist items (category, item, check required, order) for each process of a production type.","① 생산유형을 선택하고 [검색]을 누릅니다.":"① Select a production type and click [Search].","③ 좌측 생산공정 목록에서 공정을 선택합니다.":"③ Select a process from the production process list on the left.","④ 우측 점검사항을 확인하고 [추가]·[삭제]로 관리합니다.":"④ Review the checklist items on the right and manage them with [Add] and [Delete].","생산유형은 필수 조회조건입니다.":"Production type is a required search condition.","포장 제조번호별로 제품 포장 작업량·투입인원·공수를 등록하고 파렛트 단위 생산수량 등록과 바코드 출력을 처리합니다.":"Register product packaging workload, staff and man-hours by packaging Mfg. No., and handle production quantity registration per pallet and barcode printing.","① 제조번호·품목코드·기간을 지정하고 [검색]을 누릅니다.":"① Specify the Mfg. No., item code and period, then click [Search].","③ 좌측 상단 포장 목록에서 제조번호를 선택합니다.":"③ Select a Mfg. No. from the packaging list at the top left.","④ 우측 상단에서 작업시간·인원을 [추가]·[저장]하고 [작업완료]합니다.":"④ At the top right, [Add] and [Save] work time and staff, then click [Complete Work].","④ 하단에서 파렛트별 생산수량을 등록하고 바코드를 출력합니다.":"④ At the bottom, register production quantities per pallet and print barcodes.","조회 기간 기본값은 최근 20일입니다.":"The search period defaults to the last 20 days.","작업완료 후에는 생산을 추가·수정할 수 없습니다([완료취소]로 변경).":"After work is completed, production cannot be added or edited (use [Cancel Completion] to change).","단량포장 제조번호별 생산실적(수량·불량·검체량·작업인원·소비기한·창고)을 등록하고 가입고 등록·취소와 부자재 등록을 처리합니다.":"Register production results (quantity, defects, sample quantity, workers, expiry date, warehouse) by unit-packaging Mfg. No., and handle provisional receipt registration/cancellation and sub-material registration.","① 제조번호를 선택하고 [검색]을 누릅니다.":"① Select a Mfg. No. and click [Search].","③ 상단 생산실적 목록에서 제조번호를 선택합니다.":"③ Select a Mfg. No. from the production result list at the top.","④ 하단에 실적 수량·불량·작업인원 등을 입력하고 [저장]합니다.":"④ Enter result quantity, defects, workers, etc. at the bottom and click [Save].","② 실적을 선택해 [가입고등록]하거나, 승인된 건은 [가입고취소]합니다.":"② Select a result and click [Register Provisional Receipt], or [Cancel Provisional Receipt] for approved records.","계획수량은 수량 이상이어야 합니다.":"The planned quantity must be greater than or equal to the quantity.","[가입고등록]은 미승인 항목만, [가입고취소]는 승인된 항목 1건만 가능합니다.":"[Register Provisional Receipt] applies only to unapproved items, and [Cancel Provisional Receipt] only to a single approved item.","제조지시별 생산실적을 승인·승인취소하고, 실적에 따른 원·부자재 소요량과 불량출고를 계산·수정해 투입량을 확정합니다.":"Approve or cancel approval of production results by work order, and calculate/edit raw and sub-material requirements and defect issues based on results to confirm input quantities.","① 분말/액상/연질·기간·제조번호를 지정하고 [검색]을 누릅니다.":"① Specify powder/liquid/softgel, period and Mfg. No., then click [Search].","③ 상단 생산실적을 선택하고 [승인] 또는 [승인취소]합니다.":"③ Select a production result at the top and click [Approve] or [Cancel Approval].","④ 계획·실적 수량을 넣고 [계산]해 소요량을 산출하거나 수정합니다.":"④ Enter planned and actual quantities and click [Calculate] to compute or edit requirements.","④ [원부자재 투입량 확정]으로 확정하고 필요 시 [담당자 변경]합니다.":"④ Confirm with [Confirm Material Input] and use [Change Owner] if needed.","승인 상태에서는 소요량을 수정할 수 없습니다.":"Requirements cannot be edited in approved status.","배치별 원료 해포 작업을 수행합니다. 원료 바코드를 리딩해 입고Lot별 해포 사용량을 등록하고 해포를 완료합니다.":"Perform raw material unpacking per batch. Scan raw material barcodes, register unpacking usage per receipt Lot, and complete unpacking.","① 제조번호·배치번호를 지정해 [검색]하거나 [바코드 스캔]합니다.":"① Specify the Mfg. No. and batch No. and click [Search], or use [Scan Barcode].","③ 상단 작업정보와 원료별 지시량·투입량을 확인하고 원료를 선택합니다.":"③ Check the work information and ordered/input quantities per raw material at the top, and select a raw material.","④ [바코드 리딩]으로 입고Lot 사용량을 등록합니다(잘못 등록 시 [삭제]).":"④ Register the receipt Lot usage with [Read Barcode] (use [Delete] if registered incorrectly).","② [작업공수]를 입력하고 [해포완료]를 누릅니다.":"② Enter [Man-hours] and click [Complete Unpacking].","제조번호와 배치번호를 선택해야 조회됩니다.":"A Mfg. No. and batch No. must be selected to search.","합포장 코드별 작업을 등록하고 파렛트 단위 생산수량을 기록한 뒤 작업완료·완료취소로 상태를 관리합니다.":"Register work by combined-packaging code, record production quantities per pallet, and manage status with Complete Work/Cancel Completion.","① 합포장코드·품목명·기간을 지정하고 [검색]을 누릅니다.":"① Specify the combined-packaging code, item name and period, then click [Search].","② [추가]로 합포장 작업을 등록하고 [저장]합니다.":"② Register combined-packaging work with [Add] and click [Save].","③ 상단에서 합포장 작업을 선택합니다.":"③ Select a combined-packaging job at the top.","④ 하단에서 파렛트별 생산수량을 [추가]·[저장]하고 [작업완료]합니다.":"④ At the bottom, [Add] and [Save] production quantities per pallet, then click [Complete Work].","[작업완료]는 진행 상태, [완료취소]는 완료 상태일 때만 표시됩니다.":"[Complete Work] is shown only in progress status, and [Cancel Completion] only in completed status.","생산오더별로 설비의 공정검사(중량·온도) 등록 현황을 조회하고, 추천 회차별 검사값 등록과 공정기록서 확인을 합니다.":"View equipment in-process inspection (weight/temperature) registration status by production order, register inspection values per recommended round, and check process batch records.","① 분말/액상/연질·제조번호·생산계획 기간 등을 지정하고 [검색]을 누릅니다.":"① Specify powder/liquid/softgel, Mfg. No., production plan period, etc., then click [Search].","③ 상단 목록에서 생산오더를 선택합니다.":"③ Select a production order from the list at the top.","④ 하단 설비별 등록 현황에서 [등록(중량/온도)]으로 검사값을 입력합니다.":"④ In the registration status by equipment at the bottom, enter inspection values with [Register (Weight/Temp.)].","② 추천 회차를 고르고 [공정기록서 확인]으로 기록서를 봅니다.":"② Choose a recommended round and view the record with [Check Process Record].","생산계획 시작일 기본값은 오늘입니다.":"The production plan start date defaults to today.","검사값은 기준 범위(예: 1.96~2.04) 안에서만 입력할 수 있습니다.":"Inspection values can only be entered within the standard range (e.g. 1.96–2.04).","제품·공정·제조번호·설비·기간별로 설비에서 수집된 데이터 항목의 값과 기준범위, 상태를 조회합니다.":"View values, standard ranges and status of data items collected from equipment by product, process, Mfg. No., equipment and period.","① 제품명·공정·제조번호·설비명과 기간을 지정하고 [검색]을 누릅니다.":"① Specify the product name, process, Mfg. No., equipment name and period, then click [Search].","③ 수집일시별 데이터항목의 값과 기준범위, 데이터상태를 확인합니다.":"③ Check data item values, standard ranges and data status by collection time.","제품명·제조번호·설비명은 입력 시 자동완성 목록에서 선택할 수 있습니다.":"Product name, Mfg. No. and equipment name can be selected from an autocomplete list as you type.","입고된 원자재·부자재·상품 중 수입검사 대상을 조회하고, 접수일자를 지정해 수입검사를 접수합니다.":"View received raw materials, sub-materials and goods subject to incoming inspection, and register incoming inspection receipts with a receipt date.","① 검사선택(원자재/부자재/상품)과 조건을 지정하고 [검색]을 누릅니다.":"① Specify the inspection type (Raw material/Sub-material/Goods) and conditions, then click [Search].","③ 목록에서 접수할 항목을 하나 이상 선택합니다.":"③ Select one or more items to register in the list.","② 접수일자를 확인하고 [검사접수]를 누릅니다.":"② Check the receipt date and click [Register Inspection].","② 검사완료 항목은 [접수일자 변경]으로 접수일을 수정합니다.":"② For inspection-completed items, change the receipt date with [Change Receipt Date].","접수일자 기본값은 오늘이며, 접수완료가 N인 항목만 접수할 수 있습니다.":"The receipt date defaults to today, and only items with Received = N can be registered.","[접수일자 변경]은 검사완료(Y) 항목을 1건 선택했을 때만 열립니다.":"[Change Receipt Date] opens only when exactly one inspection-completed (Y) item is selected.","수입검사 접수된 원자재·부자재·상품의 검사결과(적부, 불량·합격수량)를 등록·조회하고 바코드를 출력합니다.":"Register and view inspection results (pass/fail, defective/accepted quantity) for raw materials, sub-materials and goods registered for incoming inspection, and print barcodes.","① 검사선택과 접수기간 등 조건을 지정하고 [검색]을 누릅니다.":"① Specify conditions such as inspection type and receipt period, then click [Search].","③ 목록에서 검사결과를 등록할 항목 1건을 선택합니다.":"③ Select one item in the list to register inspection results for.","② [검사결과등록]에서 적부여부·불량/합격수량을 입력해 저장합니다.":"② In [Register Inspection Result], enter pass/fail and defective/accepted quantities, then save.","② 등록된 결과는 [상세보기]로 확인하고 성적서를 출력합니다.":"② Check registered results with [View Details] and print the certificate of analysis.","② [바코드 출력]·[엑셀저장]으로 출력·저장합니다.":"② Print or save with [Print Barcode] and [Save to Excel].","[상세보기]·[검사결과등록]은 1건만 선택해야 동작합니다.":"[View Details] and [Register Inspection Result] work only when exactly one item is selected.","바코드 출력은 검사완료 항목만, 바코드 프린터가 연결된 단말에서만 가능합니다.":"Barcode printing is available only for inspection-completed items and only on terminals connected to a barcode printer.","생산 배치의 공정 실적을 조회하고, 접수일자를 지정해 공정검사를 접수합니다.":"View process results of production batches and register in-process inspection receipts with a receipt date.","① 생산오더·공정일자 기간과 공정, 품목명을 지정하고 [검색]을 누릅니다.":"① Specify the production order/process date period, process and item name, then click [Search].","③ 목록에서 접수할 배치를 하나 이상 선택합니다.":"③ Select one or more batches to register in the list.","② 접수일자를 확인하고 [공정검사접수]를 누릅니다.":"② Check the receipt date and click [Register In-process Inspection].","접수일자 기본값은 오늘이며, 이미 접수된 항목이 포함되면 접수되지 않습니다.":"The receipt date defaults to today, and nothing is registered if already-registered items are included.","공정검사 접수된 배치를 조회하고 공정검사결과(적부, 불량·합격수량)를 등록하거나 상세 내용을 확인합니다.":"View batches registered for in-process inspection and register in-process inspection results (pass/fail, defective/accepted quantity) or check details.","① 기간·공정·품목명을 지정하고 [검색]을 누릅니다.":"① Specify the period, process and item name, then click [Search].","③ 목록에서 결과를 등록할 배치를 선택합니다.":"③ Select the batch to register results for in the list.","② [공정검사결과등록]에서 시험결과와 적부여부·수량을 입력해 저장합니다.":"② In [Register In-process Result], enter test results, pass/fail and quantities, then save.","③ 행의 [상세보기]를 눌러 등록된 결과를 확인합니다.":"③ Click [View Details] on a row to check registered results.","검사완료(Y)된 항목은 등록할 수 없고 [상세보기]로만 조회됩니다.":"Inspection-completed (Y) items cannot be registered and can only be viewed with [View Details].","생산입고된 제품을 조회하고, 접수일자를 지정해 출하검사를 접수합니다.":"View products received from production and register shipment inspection receipts with a receipt date.","① 생산오더·입고일자 기간과 품목명을 지정하고 [검색]을 누릅니다.":"① Specify the production order/receipt date period and item name, then click [Search].","③ 목록에서 접수할 입고 건을 하나 이상 선택합니다.":"③ Select one or more receipts to register in the list.","② 접수일자를 확인하고 [출하검사접수]를 누릅니다.":"② Check the receipt date and click [Register Shipment Inspection].","출하검사 접수된 제품을 조회하고 출하검사결과를 등록하거나 상세 내용을 확인합니다.":"View products registered for shipment inspection and register shipment inspection results or check details.","① 기간·상태·품목을 지정하고 [검색]을 누릅니다.":"① Specify the period, status and item, then click [Search].","③ 목록에서 결과를 등록할 항목을 선택합니다.":"③ Select the item to register results for in the list.","② [출하검사결과등록]에서 시험결과와 적부여부·수량을 입력해 저장합니다.":"② In [Register Shipment Result], enter test results, pass/fail and quantities, then save.","③ 행의 [상세보기]로 등록된 결과를 확인합니다.":"③ Check registered results with [View Details] on a row.","제조번호별 생산현황과 검사현황을 조회하고, 수입·공정·완제품검사 결과 이력을 팝업으로 확인합니다.":"View production and inspection status by Mfg. No., and check incoming, in-process and finished product inspection result history in popups.","① 제품명·검사현황·생산현황과 생산예정 기간을 지정하고 [검색]을 누릅니다.":"① Specify the product name, inspection status, production status and planned production period, then click [Search].","③ 제조번호별 생산현황과 검사현황(대기/진행/완료)을 확인합니다.":"③ Check production status and inspection status (Pending/In progress/Completed) by Mfg. No.","③ 행의 [수입검사]·[공정검사]·[완제품검사] 버튼으로 상세 결과를 엽니다.":"③ Open detailed results with the [Incoming], [In-process] and [Finished Product] inspection buttons on a row.","해당 검사가 진행되지 않은 건은 상세 팝업이 열리지 않습니다.":"The detail popup does not open for inspections that have not been performed.","품목별로 검사종류·공정·검사항목·검사방법·기준값 등 검사항목을 등록하고 관리합니다.":"Register and manage inspection items per item, such as inspection type, process, test item, test method and standard values.","① 품목유형·제품코드·제품·제품유형을 지정하고 [검색]을 누릅니다.":"① Specify the item type, product code, product and product type, then click [Search].","③ 좌측 목록에서 품목을 선택합니다.":"③ Select an item from the list on the left.","④ 우측에 [추가]로 행을 만들고 검사항목을 입력한 뒤 [저장]합니다.":"④ On the right, create a row with [Add], enter the inspection item, and click [Save].","② 필요 시 [제품유형 등록]으로 제품유형을 지정합니다.":"② If needed, assign a product type with [Register Product Type].","④ 불필요한 항목은 선택 후 [삭제]합니다.":"④ Select unnecessary items and click [Delete].","품목유형 기본값은 제품입니다.":"The item type defaults to Product.","검사종류와 검사항목이 같은 행은 중복 저장할 수 없습니다.":"Rows with the same inspection type and inspection item cannot be saved twice.","LIMS 연동 버전으로, 가입고된 원자재·부자재·상품을 조회해 수입검사를 접수하고 LIMS로 의뢰합니다.":"LIMS-integrated version: view provisionally received raw materials, sub-materials and goods, register incoming inspection receipts, and request testing in LIMS.","① 검사선택과 가입고 기간 등 조건을 지정하고 [검색]을 누릅니다.":"① Specify conditions such as inspection type and provisional receipt period, then click [Search].","② 필요 시 [접수일자 변경]으로 접수일을 수정합니다.":"② If needed, change the receipt date with [Change Receipt Date].","가입고 기간 기본값은 최근 30일, 접수일자 기본값은 오늘입니다.":"The provisional receipt period defaults to the last 30 days, and the receipt date defaults to today.","합격수량이 가입고수량과 다른 행은 붉은 배경으로 표시됩니다.":"Rows whose accepted quantity differs from the provisional receipt quantity are highlighted in red.","LIMS 연동 버전으로, LIMS 시험완료된 수입검사 건을 승인 또는 승인취소하고 ERP에 결과를 전송합니다.":"LIMS-integrated version: approve or cancel approval of incoming inspections completed in LIMS and send the results to ERP.","① 검사선택·상태·접수기간 등을 지정하고 [검색]을 누릅니다.":"① Specify the inspection type, status, receipt period, etc., then click [Search].","③ 목록에서 처리할 항목 1건을 선택합니다.":"③ Select one item to process from the list.","② 시험완료 건은 [승인], 취소요청 건은 [승인취소]를 누릅니다.":"② Click [Approve] for test-completed items, or [Cancel Approval] for cancellation-requested items.","② 승인완료 건은 [바코드 출력]으로 라벨을 출력합니다.":"② Print labels for approved items with [Print Barcode].","승인은 시험완료, 승인취소는 취소요청 상태 항목만 1건씩 처리됩니다.":"Approval applies only to Test Completed items and approval cancellation only to Cancellation Requested items, one at a time.","수입검사접수 기간 기본값은 최근 14일입니다.":"The incoming inspection receipt period defaults to the last 14 days.","LIMS 연동 버전으로, 생산입고·OEM입고 건의 작업지시를 조회해 LIMS 시험검사를 접수합니다.":"LIMS-integrated version: looks up work orders for production and OEM receipts and registers LIMS tests/inspections.","① 구분(생산입고/OEM입고)과 생산오더 기간 등을 지정하고 [검색]을 누릅니다.":"① Set the type (Production Receipt/OEM Receipt), production order period, etc., and click [Search].","② 접수일자를 확인하고 [시험검사접수]를 누릅니다.":"② Check the receipt date and click [Register Test/Inspection].","구분 기본값은 생산입고, 생산오더 시작일 기본값은 7일 전입니다.":"Type defaults to Production Receipt, and the production order start date defaults to 7 days ago.","이미 접수된 항목이 포함되면 접수되지 않습니다.":"If already-registered items are included, they will not be registered.","LIMS 연동 버전으로, 가입고된 생산입고·OEM입고 제품을 조회해 출하검사를 접수하고 LIMS로 의뢰합니다.":"LIMS-integrated version: looks up provisionally received production and OEM products, registers shipment inspections, and requests them in LIMS.","① 구분과 생산오더·가입고일자 기간 등을 지정하고 [검색]을 누릅니다.":"① Set the type, production order and provisional receipt date periods, etc., and click [Search].","가입고일자 기본값은 최근 14일이며, 이미 접수된 항목은 다시 접수되지 않습니다.":"Provisional receipt date defaults to the last 14 days, and items already registered are not registered again.","LIMS 연동 버전으로, LIMS 시험완료된 출하검사 건을 승인 또는 승인취소하고 ERP에 결과를 전송합니다.":"LIMS-integrated version: approves or cancels approval of shipment inspections completed in LIMS and sends results to ERP.","① 구분·기간·상태·품목을 지정하고 [검색]을 누릅니다.":"① Set the type, period, status, and item, and click [Search].","입고일자 기간 기본값은 최근 14일입니다.":"The receipt date period defaults to the last 14 days.","LIMS 연동 버전으로, 생산 배치의 공정 실적을 조회해 공정검사를 접수하고 LIMS로 의뢰합니다.":"LIMS-integrated version: looks up process results of production batches, registers in-process inspections, and requests them in LIMS.","공정일자 시작일 기본값은 7일 전, 접수일자 기본값은 오늘입니다.":"Process date start defaults to 7 days ago, and the receipt date defaults to today.","작업지시별 공정 기록서의 출하의뢰 내역을 조회하고, 기록서를 열람한 뒤 확인 처리합니다.":"Looks up shipment requests from process batch records by work order, opens the batch records, and confirms them.","① 제형·품목유형·제품코드·제조번호와 기간을 지정하고 [검색]을 누릅니다.":"① Set the dosage form, item type, product code, Mfg. No., and period, and click [Search].","③ 상단 목록에서 작업지시를 선택합니다.":"③ Select a work order in the upper list.","④ 하단에서 공정별 기록서와 의뢰·확인 상태를 확인합니다.":"④ Check the batch records by process and their request/confirmation status in the lower section.","② 하단 항목 선택 후 [기록서확인]으로 기록서를 열람합니다.":"② Select an item in the lower section and open the batch record with [View Batch Record].","② [확인]을 눌러 출하의뢰 건을 확인 처리합니다.":"② Click [Confirm] to confirm the shipment request.","출하의뢰되지 않았거나 이미 확인된 건은 [확인]할 수 없습니다.":"Items not yet requested for shipment or already confirmed cannot be confirmed.","수입검사가 완료된 구매 상품을 조회하고, 제조번호·접수수량·소비기한을 입력해 입고접수합니다.":"Looks up purchased goods that passed incoming inspection and registers receipt by entering Mfg. No., received quantity, and expiry date.","① 구매오더·수입검사 기간과 상태 등을 지정하고 [검색]을 누릅니다.":"① Set the purchase order and incoming inspection periods, status, etc., and click [Search].","③ 상단 목록에서 검사완료된 구매오더 라인을 선택합니다.":"③ Select an inspected purchase order line in the upper list.","④ 하단에서 [추가] 후 제조번호·접수수량 등을 입력하고 [저장]합니다.":"④ In the lower section, click [Add], enter the Mfg. No., received quantity, etc., and click [Save].","④ 잘못 접수한 행은 선택 후 [삭제]합니다.":"④ Select incorrectly registered rows and click [Delete].","상태 기본값은 검사완료이며, 검사완료된 상품만 입고접수할 수 있습니다.":"Status defaults to Inspection Completed, and only inspected goods can be registered for receipt.","제조번호는 필수, 접수수량은 0보다 커야 하며 입고생성 완료 건은 삭제할 수 없습니다.":"Mfg. No. is required, received quantity must be greater than 0, and items with receipts already created cannot be deleted.","상품 입고접수 내역을 조회하고, 입고일자를 지정해 입고를 생성(확정)하거나 취소합니다.":"Looks up goods receipt registrations and creates (confirms) or cancels receipts for a specified receipt date.","① 접수 기간·공급업체·처리상태 등을 지정하고 [검색]을 누릅니다.":"① Set the registration period, supplier, processing status, etc., and click [Search].","③ 목록에서 입고할 접수 건을 하나 이상 선택합니다.":"③ Select one or more registrations to receive from the list.","② 입고일자를 지정하고 [입고생성]을 누릅니다.":"② Set the receipt date and click [Create Receipt].","② 입고된 건을 취소하려면 선택 후 [입고취소]를 누릅니다.":"② To cancel a received item, select it and click [Cancel Receipt].","접수 기간 기본값은 최근 7일입니다.":"The registration period defaults to the last 7 days.","이미 입고된 건이나 제조번호가 빈 건은 입고생성할 수 없습니다.":"Receipts cannot be created for items already received or with a blank Mfg. No.","LIMS 연동 버전으로, LIMS 수입검사 승인된 구매 상품을 조회해 제조번호·접수수량을 입력하고 입고접수합니다.":"LIMS-integrated version: looks up purchased goods approved in LIMS incoming inspection and registers receipt by entering Mfg. No. and received quantity.","③ 상단 목록에서 승인완료된 구매오더 라인을 선택합니다.":"③ Select an approved purchase order line in the upper list.","수입검사 기간 기본값은 최근 60일이며, 승인된 상품만 접수할 수 있습니다.":"Incoming inspection period defaults to the last 60 days, and only approved goods can be registered.","취소요청 건은 추가할 수 없고, 입고생성 완료 건은 수정·삭제할 수 없습니다.":"Cancellation-requested items cannot be added, and items with receipts already created cannot be edited or deleted.","LIMS 연동 버전으로, 상품 입고접수 내역을 입고생성·취소하고 ERP 전송상태를 함께 확인합니다.":"LIMS-integrated version: creates or cancels receipts for goods receipt registrations and also checks the ERP transmission status.","③ 목록에서 입고할 접수 건을 선택하고 전송상태를 확인합니다.":"③ Select the registrations to receive from the list and check the transmission status.","② 입고일자를 지정하고 [입고생성]을 눌러 확인창에서 승인합니다.":"② Set the receipt date, click [Create Receipt], and approve in the confirmation dialog.","② 입고된 건은 [입고취소]로 취소합니다.":"② Cancel received items with [Cancel Receipt].","입고생성·입고취소 내역은 ERP로 전송되며, 인터페이스 데이터는 5분 간격으로 전송됩니다.":"Receipt creation and cancellation records are sent to ERP, and interface data is transmitted every 5 minutes.","LIMS 출하검사 승인된 OEM 제품을 조회해 제조번호·접수수량·소비기한을 입력하고 입고접수합니다.":"Looks up OEM products approved in LIMS shipment inspection and registers receipt by entering Mfg. No., received quantity, and expiry date.","① 가입고·수입검사 기간과 제조LOT번호 등을 지정하고 [검색]을 누릅니다.":"① Set the provisional receipt and incoming inspection periods, Mfg. LOT No., etc., and click [Search].","③ 상단 목록에서 승인완료된 OEM 입고 건을 선택합니다.":"③ Select an approved OEM receipt in the upper list.","수입검사 기간 기본값은 최근 60일, 품목그룹 기본값은 제품(OEM)입니다.":"Incoming inspection period defaults to the last 60 days, and item group defaults to Product (OEM).","승인된 건만 접수할 수 있고, 입고생성 완료 건은 수정·삭제할 수 없습니다.":"Only approved items can be registered, and items with receipts already created cannot be edited or deleted.","OEM 제품 입고접수 내역을 조회해 입고를 생성(확정)하거나 취소하고 ERP 전송상태를 확인합니다.":"Looks up OEM product receipt registrations, creates (confirms) or cancels receipts, and checks the ERP transmission status.","① 접수 기간·LOT NO·제조업체·처리상태를 지정하고 [검색]을 누릅니다.":"① Set the registration period, LOT NO, manufacturer, and processing status, and click [Search].","공장·부서·자산유형별 설비 기본정보(자산번호, 취득·잔존가액, 설치위치 등)를 등록·수정·삭제하고 설비 바코드를 출력합니다.":"Registers, edits, and deletes basic equipment information (asset no., acquisition/residual value, installation location, etc.) by plant, department, and asset type, and prints equipment barcodes.","① 공장·자산유형·설치위치 등 조건을 지정하고 [검색]을 누릅니다.":"① Set conditions such as plant, asset type, and installation location, and click [Search].","② [등록]으로 설비 기본·보전·검교정·상세스펙 정보를 입력합니다.":"② Enter basic, maintenance, calibration, and detailed spec information with [Register].","③ 목록에서 설비를 선택해 [수정]·[삭제]·[바코드 출력]을 실행합니다.":"③ Select equipment in the list and run [Edit], [Delete], or [Print Barcode].","③ [상세스펙] 버튼을 누르면 설비 상세정보를 조회 전용으로 봅니다.":"③ Click [Detailed Specs] to view equipment details in read-only mode.","바코드 출력은 바코드 프린터가 연결된 단말에서만 가능하며, 여러 설비를 선택해 출력할 수 있습니다.":"Barcodes can be printed only from terminals connected to a barcode printer, and multiple pieces of equipment can be selected for printing.","삭제 시 확인 창이 표시되며, 선택한 첫 번째 행이 삭제됩니다.":"A confirmation dialog appears on deletion, and the first selected row is deleted.","설비 소모품의 유형·번호·사용용도·공정·적정재고 등 기준정보를 등록·수정·삭제합니다.":"Registers, edits, and deletes master data for equipment consumables, such as type, number, usage, process, and optimal stock.","① 공장·소모품 유형·담당부서를 지정하고 [검색]을 누릅니다.":"① Set the plant, consumable type, and responsible department, and click [Search].","② [등록]으로 새 소모품과 적정재고를 입력합니다.":"② Enter a new consumable and its optimal stock with [Register].","③ 목록에서 소모품을 선택해 [수정]·[삭제]합니다.":"③ Select a consumable in the list and click [Edit] or [Delete].","③ [상세스펙보기]로 소모품 상세정보를 확인합니다.":"③ Check consumable details with [View Detailed Specs].","삭제 시 확인 창이 표시됩니다.":"A confirmation dialog appears on deletion.","설비 고장 발생 요청과 조치 결과(처리자, 조치내용, 수리비용, 사용부품)를 등록하고 이력을 조회합니다.":"Registers equipment breakdown requests and corrective action results (handler, action taken, repair cost, parts used) and looks up history.","① 자산번호·요청자·처리자·고장발생 기간을 지정하고 [검색]을 누릅니다.":"① Set the asset no., requester, handler, and breakdown period, and click [Search].","② [등록]으로 고장 발생 내용을 입력합니다.":"② Enter breakdown details with [Register].","③ 목록에서 고장 건을 선택해 [수정]으로 조치 결과를 입력합니다.":"③ Select a breakdown in the list and enter the corrective action results with [Edit].","② 잘못 등록한 건은 선택 후 [삭제]합니다.":"② Select incorrectly registered items and click [Delete].","설비 이력 중 '설비고장' 유형만 조회됩니다(설비보전관리와 같은 이력 테이블 사용).":"Only the 'Equipment Breakdown' type of equipment history is shown (uses the same history table as Equipment Maintenance).","설비의 점검주기·점검기준일에 따른 보전 작업 대상과 처리 결과(담당자, 보전일, 처리여부)를 관리합니다.":"Manages maintenance targets based on equipment inspection cycles and reference dates, and their results (assignee, maintenance date, completion).","① 자산번호·담당자·설비보전 기간을 지정하고 [검색]을 누릅니다.":"① Set the asset no., assignee, and maintenance period, and click [Search].","② [등록]으로 설비 보전 내역을 입력합니다.":"② Enter equipment maintenance records with [Register].","③ 목록에서 보전 건을 선택해 [수정]으로 처리여부·내용을 입력합니다.":"③ Select a maintenance item in the list and enter completion status and details with [Edit].","[점검대상생성] 버튼은 화면에 있으나 현재 기능이 연결되어 있지 않습니다.":"The [Generate Inspection Targets] button is on the screen but is not currently functional.","설비 이력 중 '설비보전' 유형만 조회됩니다.":"Only the 'Equipment Maintenance' type of equipment history is shown.","설비 마스터의 전체 사양(모델명, 제작사, Utility 사양, 용량 등)을 한눈에 조회하고 설비별 고장·보전 이력을 확인합니다.":"Shows all equipment master specs (model, manufacturer, utility specs, capacity, etc.) at a glance and checks breakdown and maintenance history per equipment.","① 공장·자산유형·공정·제작사 등 조건을 지정하고 [검색]을 누릅니다.":"① Set conditions such as plant, asset type, process, and manufacturer, and click [Search].","③ 목록에서 설비별 사양과 점검 주기를 확인합니다.":"③ Check the specs and inspection cycles of each piece of equipment in the list.","③ [고장이력]·[보전이력] 셀을 누르면 해당 설비의 이력 팝업이 열립니다.":"③ Click a [Breakdown History] or [Maintenance History] cell to open the history pop-up for that equipment.","공장 조건에는 '전체' 항목이 없어 공장을 하나 선택해 조회합니다.":"The plant condition has no 'All' option, so select one plant to search.","이력 팝업에서도 [엑셀저장]으로 이력을 저장할 수 있습니다.":"History can also be saved with [Save to Excel] in the history pop-up.","설비 소모품의 입고 내역(입고일, 입고수량, 납품업체, 창고)을 등록하고 누적재고와 함께 조회합니다.":"Registers receipts of equipment consumables (receipt date, quantity, supplier, warehouse) and shows them with cumulative stock.","① 입고일자 기간과 소모품 조건을 지정하고 [검색]을 누릅니다.":"① Set the receipt date period and consumable conditions, and click [Search].","② [등록]으로 소모품 입고 내역을 입력합니다.":"② Enter consumable receipts with [Register].","③ 목록에서 입고 건을 선택한 뒤 [수정] 또는 [삭제]합니다.":"③ Select a receipt in the list and click [Edit] or [Delete].","[수정]은 한 건 선택 시에만, [삭제]는 한 건 이상 선택 시에만 표시되며 여러 건을 한 번에 삭제할 수 있습니다.":"[Edit] appears only when one item is selected, and [Delete] only when one or more are selected; multiple items can be deleted at once.","설비 소모품의 출고 내역(출고일, 출고수량, 출고 사유)을 등록하고 누적재고와 함께 조회합니다.":"Registers issues of equipment consumables (issue date, quantity, reason) and shows them with cumulative stock.","① 출고일자 기간과 소모품 조건을 지정하고 [검색]을 누릅니다.":"① Set the issue date period and consumable conditions, and click [Search].","② [등록]으로 소모품 출고 수량과 사유를 입력합니다.":"② Enter the consumable issue quantity and reason with [Register].","③ 목록에서 출고 건을 선택한 뒤 [수정] 또는 [삭제]합니다.":"③ Select an issue in the list and click [Edit] or [Delete].","[수정]은 한 건 선택 시에만, [삭제]는 한 건 이상 선택 시에만 표시됩니다.":"[Edit] appears only when one item is selected, and [Delete] only when one or more are selected.","공장·소모품유형·담당부서별로 소모품의 현 재고를 적정재고와 비교해 조회합니다.":"Shows current consumable stock compared with optimal stock by plant, consumable type, and responsible department.","① 공장·소모품유형·담당부서를 지정하고 [검색]을 누릅니다.":"① Set the plant, consumable type, and responsible department, and click [Search].","③ 목록에서 소모품별 현 재고와 적정재고를 비교합니다.":"③ Compare current and optimal stock for each consumable in the list.","② [엑셀]로 재고 목록을 저장합니다.":"② Save the stock list with [Excel].","현 재고는 소모품 입고·출고 등록 내역으로 계산됩니다.":"Current stock is calculated from registered consumable receipts and issues.","설비별로 연결된 센서(SID, TID)와 설정값을 등록·수정·삭제하고 조회합니다.":"Registers, edits, deletes, and looks up sensors (SID, TID) linked to each piece of equipment and their settings.","① 자산유형·장소·공정 등 조건을 지정하고 [검색]을 누릅니다.":"① Set conditions such as asset type, location, and process, and click [Search].","② [등록]으로 설비에 센서 정보를 추가합니다.":"② Add sensor information to equipment with [Register].","③ 목록에서 센서를 선택해 [수정]·[삭제]합니다.":"③ Select a sensor in the list and click [Edit] or [Delete].","생산구분·문서양식별 결재문서를 정의하고, 문서마다 결재라인(결재자와 결재 순서)을 지정합니다.":"Defines approval documents by production category and document template, and sets the approval line (approvers and order) for each document.","① 생산구분·문서양식을 지정하고 [검색]을 누릅니다.":"① Set the production category and document template, and click [Search].","③ 좌측에서 [추가]로 결재문서를 입력하고 [저장]합니다.":"③ On the left, enter an approval document with [Add] and click [Save].","④ 결재문서를 선택하면 우측에 결재라인이 표시됩니다.":"④ Selecting an approval document shows its approval line on the right.","④ 우측 [추가] 후 [결재자] 셀을 눌러 결재자를 지정하고 [저장]합니다.":"④ Click [Add] on the right, click the [Approver] cell to assign an approver, and click [Save].","② 불필요한 행은 선택 후 각 영역의 [삭제]를 누릅니다.":"② Select unneeded rows and click [Delete] in each area.","공정기록서 결재선은 4차 이하, 제조지시서·생산일보 결재선은 2차 이하로만 만들 수 있습니다.":"Approval lines for process batch records can have up to 4 levels, and those for manufacturing instructions and daily production reports up to 2 levels.","화면을 열면 자동으로 조회되며, 저장 시 모든 항목을 입력해야 합니다.":"Data loads automatically when the screen opens, and all fields must be filled in to save.","사용자가 자주 쓰는 개인 결재문서를 만들고 결재라인의 결재자를 지정합니다.":"Creates personal approval documents frequently used by the user and assigns approvers to the approval line.","① 나의결재문서명을 입력하고 [검색]을 누릅니다.":"① Enter the My Approval Document name and click [Search].","③ 좌측 [추가]·[수정]으로 나의 결재라인을 등록·변경합니다.":"③ Register or change your approval line with [Add] or [Edit] on the left.","④ 문서를 선택하면 우측에 결재라인이 표시됩니다.":"④ Selecting a document shows its approval line on the right.","④ [결재자] 셀을 눌러 결재자를 바꾸고 [저장]합니다.":"④ Click the [Approver] cell to change the approver and click [Save].","화면을 열면 자동으로 조회되며, [수정]은 좌측 문서를 선택해야 열립니다.":"Data loads automatically when the screen opens, and [Edit] opens only after selecting a document on the left.","우측 [결재라인명]은 수정할 수 없습니다.":"The [Approval Line Name] on the right cannot be edited.","로그인 사용자에게 올라온 결재 문서를 상태별로 조회하고, 문서를 열어 결재 또는 반려합니다.":"Looks up approval documents submitted to the logged-in user by status, and opens them to approve or reject.","① 생산구분·상태(결재대기/반려/결재완료)·기간을 지정하고 [검색]을 누릅니다.":"① Set the production category, status (Pending/Rejected/Approved), and period, and click [Search].","③ 목록에서 [제목]을 누르면 결재 문서(리포트)가 새 창으로 열립니다.":"③ Click a [Title] in the list to open the approval document (report) in a new window.","③ 문서 창에서 결재 또는 반려하면 목록이 갱신됩니다.":"③ Approving or rejecting in the document window refreshes the list.","② [엑셀]로 결재 목록을 저장합니다.":"② Save the approval list with [Excel].","결재 버튼은 결재대기 상태의 문서에만 표시됩니다.":"The approve button appears only for documents pending approval.","결재완료된 최종 문서는 PDF 보기 팝업으로 열립니다.":"Fully approved final documents open in a PDF viewer pop-up.","부서·실·설비별 점검표(점검항목)를 정의하고, 하위 점검분류와 점검목록(입력타입, 상·하한값)을 설정합니다.":"Defines checklists (inspection items) by department, room, and equipment, and sets sub-categories and inspection lists (input type, upper/lower limits).","① 관리부서·점검표명 등을 지정하고 [검색]을 누릅니다.":"① Set the managing department, checklist name, etc., and click [Search].","③ [등록]으로 점검항목을 만들고, 선택 후 [수정]·[삭제]·[복사]합니다.":"③ Create inspection items with [Register], then select one to [Edit], [Delete], or [Copy].","④ 점검항목 선택 후 점검분류를 [추가]하고 [저장]합니다.":"④ After selecting an inspection item, [Add] inspection categories and click [Save].","④ 점검분류 선택 후 점검목록을 [추가]하고 입력타입·상하한값을 [저장]합니다.":"④ After selecting an inspection category, [Add] inspection list entries and [Save] the input type and upper/lower limits.","② [바코드 생성]으로 점검표 바코드를 만듭니다.":"② Create a checklist barcode with [Generate Barcode].","[수정]·[삭제]·[복사]는 검색 후 점검항목을 선택해야 표시됩니다.":"[Edit], [Delete], and [Copy] appear only after searching and selecting an inspection item.","점검목록 저장 시 점검목록·입력타입·사용여부는 필수입니다.":"When saving inspection list entries, inspection list, input type, and active status are required.","점검표와 점검일자를 선택해 점검목록별 점검값과 작업자, 조치사항을 입력·저장합니다.":"Select a checklist and inspection date to enter and save inspection values, operators, and corrective actions per inspection list entry.","① 관리부서·점검표명·실관리·설비명·점검일자를 선택하고 [검색]을 누릅니다.":"① Select the managing department, checklist name, room, equipment, and inspection date, and click [Search].","③ 점검정보에서 점검내용을 확인하고 작업자를 선택합니다.":"③ Check the inspection details in Inspection Info and select an operator.","③ 점검목록의 [점검값] 셀을 눌러 값을 입력합니다.":"③ Click the [Inspection Value] cell in the inspection list to enter a value.","④ 조치사항을 입력한 뒤 [저장]을 누릅니다.":"④ Enter corrective actions and click [Save].","관리부서·점검표명·점검일자를 모두 선택해야 조회되며, [저장]은 조회 후에만 표시됩니다.":"Managing department, checklist name, and inspection date must all be selected to search, and [Save] appears only after searching.","숫자·텍스트 입력 항목은 별도 입력 팝업에서 값을 입력합니다(태블릿 대응).":"Numeric and text fields are entered in a separate input pop-up (tablet-friendly).","월별로 작성된 점검표를 조회하고 점검 내용을 확인한 뒤 결재를 의뢰하거나 결재자를 변경합니다.":"Looks up monthly checklists, reviews the inspection details, and requests approval or changes approvers.","① 관리부서·점검표명 등과 점검월을 지정하고 [검색]을 누릅니다.":"① Set the managing department, checklist name, etc., and inspection month, and click [Search].","② [바코드 스캔]으로 점검표 바코드를 읽어 바로 찾을 수 있습니다.":"② Use [Scan Barcode] to read a checklist barcode and find it directly.","③ 점검표를 선택하고 [점검표 확인]으로 월간 점검 내용을 봅니다.":"③ Select a checklist and view the monthly inspection details with [View Checklist].","② 기안 전 점검표는 [결재의뢰], 결재대기 건은 [결재자변경]을 누릅니다.":"② Click [Request Approval] for checklists not yet submitted, or [Change Approver] for those pending approval.","[결재의뢰]는 아직 기안되지 않은 점검표, [결재자변경]은 결재대기 상태일 때만 표시됩니다.":"[Request Approval] appears only for checklists not yet submitted, and [Change Approver] only when pending approval.","부서를 등록·수정하고, 부서별 사용자 계정(ID, 성명, 직급, 연락처, 권한, 사용여부)을 관리합니다.":"Registers and edits departments, and manages user accounts per department (ID, name, position, contact, permissions, active status).","③ 좌측 부서 목록에서 부서를 선택합니다.":"③ Select a department from the department list on the left.","③ [부서 등록]·[수정]으로 부서 정보를 관리합니다.":"③ Manage department information with [Register Department] or [Edit].","④ 우측에 선택한 부서의 사용자 목록이 표시됩니다.":"④ The user list of the selected department appears on the right.","④ [사용자 등록]·[수정]으로 계정과 권한을 관리합니다.":"④ Manage accounts and permissions with [Register User] or [Edit].","조회 조건 없이 화면을 열면 부서 목록이 자동으로 조회됩니다.":"The department list loads automatically when the screen opens, without search conditions.","권한 그룹을 등록·수정하고, 그룹별로 화면(메뉴)마다 등록·읽기·수정·삭제 권한을 설정합니다.":"Registers and edits permission groups and sets create, read, update, and delete permissions per screen (menu) for each group.","③ 좌측에서 권한 그룹을 선택하거나 [등록]·[수정]으로 관리합니다.":"③ Select a permission group on the left, or manage groups with [Register] or [Edit].","④ 우측에 선택한 그룹의 화면별 권한이 표시됩니다.":"④ Screen permissions for the selected group appear on the right.","④ 화면을 선택하고 [수정]으로 등록·읽기·수정·삭제 권한을 바꿉니다.":"④ Select a screen and change create/read/update/delete permissions with [Edit].","상세 권한은 수정만 가능합니다(상세 권한 등록 버튼은 비활성화되어 있음).":"Detailed permissions can only be edited (the button for registering detailed permissions is disabled).","시스템 전반의 선택 목록에 쓰이는 상위코드(그룹)와 하위코드를 등록·수정합니다.":"Registers and edits parent codes (groups) and child codes used in selection lists throughout the system.","③ 좌측 상위코드 목록에서 [등록]·[수정]으로 코드 그룹을 관리합니다.":"③ Manage code groups with [Register] or [Edit] in the parent code list on the left.","④ 상위코드를 선택하면 우측에 하위코드가 표시됩니다.":"④ Selecting a parent code shows its child codes on the right.","④ 우측 [등록]·[수정]으로 하위코드와 사용여부를 관리합니다.":"④ Manage child codes and their active status with [Register] or [Edit] on the right.","삭제 기능은 비활성화되어 있어 사용하지 않는 코드는 사용여부로 관리합니다.":"Deletion is disabled, so manage unused codes through the active status.","생산유형 코드를 등록·수정하고, 생산유형별로 소속 품목을 추가하거나 제외합니다.":"Registers and edits production type codes and adds or removes items belonging to each production type.","③ 좌측 생산유형 목록에서 [등록]·[수정]으로 유형을 관리합니다.":"③ Manage types with [Register] or [Edit] in the production type list on the left.","④ 생산유형을 선택하면 우측에 해당 품목이 표시됩니다.":"④ Selecting a production type shows its items on the right.","④ [추가]로 품목을 생산유형에 연결하고, [삭제]로 제외합니다.":"④ Link items to the production type with [Add] and remove them with [Delete].","화면을 열면 생산유형 목록이 자동으로 조회됩니다.":"The production type list loads automatically when the screen opens.","생산유형의 공정별로 연동 설비의 OPC 태그 설정값과 상·하한을 등록·수정·삭제합니다.":"Registers, edits, and deletes OPC tag settings and upper/lower limits of linked equipment for each process of a production type.","③ 좌측에서 생산공정을 선택하면 우측에 OPC 설정이 표시됩니다.":"③ Selecting a production process on the left shows its OPC settings on the right.","② 공정 선택 후 [추가]로 설비 OPC 항목을 등록합니다.":"② After selecting a process, register equipment OPC entries with [Add].","④ 우측 항목을 선택하고 [수정]·[삭제]합니다.":"④ Select an entry on the right and click [Edit] or [Delete].","[추가]는 좌측 공정을, [수정]·[삭제]는 우측 항목을 먼저 선택해야 합니다.":"[Add] requires selecting a process on the left first, and [Edit]/[Delete] require selecting an entry on the right first.","시스템 좌측 메뉴의 대메뉴와 하위메뉴(코드, 순서, 사용여부, 아이콘)를 등록·수정합니다.":"Registers and edits top-level menus and submenus (code, order, active status, icon) of the system's left navigation.","③ 좌측 대메뉴 목록에서 [등록]·[수정]으로 대메뉴를 관리합니다.":"③ Manage top-level menus with [Register] or [Edit] in the top-level menu list on the left.","④ 대메뉴를 선택하면 우측에 하위메뉴가 표시됩니다.":"④ Selecting a top-level menu shows its submenus on the right.","④ 우측 [등록]·[수정]으로 하위메뉴의 순서·사용여부를 관리합니다.":"④ Manage submenu order and active status with [Register] or [Edit] on the right.","사용여부를 미사용으로 바꾸면 메뉴에서 숨길 수 있습니다.":"Setting the active status to Inactive hides the menu.","생산구분·공지대상(전체/부서/POP/포장실현황판)별 공지사항과 공지 기간을 등록·수정·삭제합니다.":"Registers, edits, and deletes notices and their display periods by production category and notice target (All/Department/POP/Packaging Room Board).","① 제목·생산구분·공지대상구분 등을 지정하고 [검색]을 누릅니다.":"① Set the title, production category, notice target, etc., and click [Search].","② [등록]으로 공지 내용과 공지 시작·종료시간을 입력합니다.":"② Enter the notice content and its start and end times with [Register].","③ 목록에서 공지를 선택해 [수정]·[삭제]합니다.":"③ Select a notice in the list and click [Edit] or [Delete].","공지 시작시간이 종료시간보다 늦으면 저장되지 않습니다.":"The notice cannot be saved if the start time is later than the end time.","공지시간은 'YYYY-MM-DD HH:mm' 형식으로 저장됩니다.":"Notice times are saved in 'YYYY-MM-DD HH:mm' format.","생산유형별 반제품마다 과립/결합액 원재료와 1차비율, 대체 원재료(대체품목)를 등록·관리합니다.":"Registers and manages granule/binder solution raw materials, primary ratios, and substitute raw materials (substitute items) for each semi-finished product by production type.","① 생산유형을 선택하면 반제품 목록이 조회됩니다.":"① Selecting a production type loads the list of semi-finished products.","③ 좌측에서 반제품을 선택하면 과립/결합액 목록이 표시됩니다.":"③ Selecting a semi-finished product on the left shows its granule/binder solution list.","④ [추가]·[삭제]로 원재료를 관리하고, 비율 변경 후 [수정]으로 저장합니다.":"④ Manage raw materials with [Add] and [Delete], and save ratio changes with [Edit].","④ 대체품목 목록에서 [추가]·[삭제]로 대체 원재료를 관리합니다.":"④ Manage substitute raw materials with [Add] and [Delete] in the substitute item list.","별도 검색 버튼 없이 생산유형을 바꾸면 바로 조회됩니다.":"There is no separate search button; changing the production type loads data immediately.","[수정] 버튼은 과립/결합액 목록에 변경된 행이 있을 때만 표시됩니다.":"The [Edit] button appears only when the granule/binder solution list has changed rows.","모니터링":"Monitoring","종합상황실1-1":"Control Room 1-1","일시정지/재시작":"Pause/Resume","제조계획":"Manufacturing Plan","생산오더번호":"Production Order No.","상태":"Status","생산오더일":"Production order date","최종실적일자":"Last result date","생산계획일":"Production plan date","제 호·사용량을 확인합니다.":"③ 一覧で入庫LOT別の出庫タイプ・製造番号・使用量を確認します。","③ [MES출고상세] 열을 눌러 출고유형별 상세 내역을 확인합니다.":"③ [MES出庫詳細]列を押して出庫タイプ別の詳細明細を確認します。","② [엑셀저장]으로 조회 결과를 저장합니다.":"② [Excel保存]で照会結果を保存します。","출고유형은 생산출고·기타출고·LOSS출고·시생산출고 중 선택합니다.":"出庫タイプは生産出庫・その他出庫・LOSS出庫・試生産出庫の中から選択します。","생산구분·제조포장·생산유형·공정별로 제조기록서의 세부공정, 타이틀, 점검항목과 시험기준표를 설정합니다.":"生産区分・製造包装・生産タイプ・工程別に、製造記録書の詳細工程、タイトル、点検項目と試験基準表を設定します。","① 생산구분·제조포장·생산유형·공정명을 모두 선택하고 [검색]을 누릅니다.":"① 生産区分・製造包装・生産タイプ・工程名をすべて選択し、[検索]を押します。","③ 세부공정 목록에서 [추가]·[저장]으로 세부공정을 관리합니다.":"③ 詳細工程一覧で[追加]・[保存]により詳細工程を管理します。","② 세부공정타이틀과 작업조건여부를 입력하고 [타이틀 저장]을 누릅니다.":"② 詳細工程タイトルと作業条件有無を入力し、[タイトル保存]を押します。","④ [시험항목]/[시험기준표] 탭에서 항목을 [추가]·[삭제]·[저장]합니다.":"④ [試験項目]/[試験基準表]タブで項目を[追加]・[削除]・[保存]します。","검색 조건 4개(생산구분, 제조포장, 생산유형, 공정명)를 모두 선택해야 조회됩니다.":"検索条件4つ(生産区分、製造包装、生産タイプ、工程名)をすべて選択すると照会されます。","[시험기준표] 탭은 선택한 세부공정이 '시험항목'일 때만 이동할 수 있습니다.":"[試験基準表]タブは、選択した詳細工程が'試験項目'の場合のみ移動できます。","생산오더별 제조·포장 기록서를 공정 단위로 확인하고 결재의뢰·결재취소·PDF 업로드와 기록서 다운로드를 처리합니다.":"生産オーダー別の製造・包装記録書を工程単位で確認し、決裁依頼・決裁取消・PDFアップロードと記録書ダウンロードを処理します。","① 구분·결재상태·생산계획 기간 등을 지정하고 [검색]을 누릅니다.":"① 区分・決裁状態・生産計画期間などを指定し、[検索]を押します。","③ 상단 목록에서 생산오더(제조번호)를 선택합니다.":"③ 上部の一覧で生産オーダー(製造番号)を選択します。","④ 하단에서 공정별 기록서 상태와 결재 진행을 확인합니다.":"④ 下部で工程別の記録書状態と決裁進行を確認します。","② [기록서확인]으로 내용을 보고 [결재의뢰]로 결재를 요청합니다.":"② [記録書確認]で内容を確認し、[決裁依頼]で決裁を依頼します。","버튼은 결재상태에 따라 바뀝니다(결재완료 시 [기록서 다운로드], 반려 시 [반려이력조회]).":"ボタンは決裁状態に応じて変わります(決裁完了時は[記録書ダウンロード]、差戻し時は[差戻し履歴照会])。","구분이 '포장'이면 [출하의뢰] 버튼이 표시됩니다.":"区分が'包装'の場合、[出荷依頼]ボタンが表示されます。","품목별 제조기록서의 제정일자·개정번호·개정일자·변경사유 등 개정 이력을 등록하고 관리합니다.":"品目別製造記録書の制定日・改訂番号・改訂日・変更理由などの改訂履歴を登録・管理します。","① 분말/액상/연질을 선택하고 [검색]을 누릅니다.":"① 粉末/液状/ソフトカプセルを選択し、[検索]を押します。","③ 좌측 품목 목록에서 품목을 선택합니다.":"③ 左側の品目一覧で品目を選択します。","④ 우측에서 해당 품목의 개정 이력을 확인합니다.":"④ 右側で該当品目の改訂履歴を確認します。","② [등록]·[수정]·[삭제]로 개정 번호를 관리합니다.":"② [登録]・[修正]・[削除]で改訂番号を管理します。","분말/액상/연질 기본값은 '분말'입니다.":"粉末/液状/ソフトカプセルの既定値は'粉末'です。","결재의뢰·결재진행중·결재완료 건은 변경할 수 없습니다.":"決裁依頼・決裁進行中・決裁完了の件は変更できません。","품목·창고·입고기간별 자재 재고를 제조번호 단위 또는 품목별 합계로 조회하고 입고Lot별 상세 재고를 확인합니다.":"品目・倉庫・入庫期間別の資材在庫を製造番号単位または品目別合計で照会し、入庫Lot別の詳細在庫を確認します。","① 품목구분·입고기간 등을 지정하고 [검색]을 누릅니다.":"① 品目区分・入庫期間などを指定し、[検索]を押します。","③ 상단 목록에서 품목별 재고를 확인하고 [상세보기]로 수불대장을 엽니다.":"③ 上部の一覧で品目別在庫を確認し、[詳細表示]で受払台帳を開きます。","④ 상단 행을 선택하면 하단에 입고Lot별 재고가 표시됩니다.":"④ 上部の行を選択すると、下部に入庫Lot別の在庫が表示されます。","② [엑셀저장]으로 목록을 저장합니다.":"② [Excel保存]で一覧を保存します。","입고 기간 기본값은 최근 7일이며, 화면 상단에 ERP 마지막 전송일시가 표시됩니다.":"入庫期間の既定値は直近7日間で、画面上部にERPの最終送信日時が表示されます。","'품목별 합계'를 체크하면 품목 단위 합계 목록으로 바뀝니다.":"'品目別合計'にチェックすると、品目単位の合計一覧に切り替わります。","제품명·제조번호·기간별로 완제품의 보관창고, 재고량·박스수량, 소비기한, 출하예정일과 완제품검사 결과를 조회합니다.":"製品名・製造番号・期間別に、完成品の保管倉庫、在庫量・箱数量、消費期限、出荷予定日と完成品検査結果を照会します。","① 제품명·제조번호와 기간을 지정하고 [검색]을 누릅니다.":"① 製品名・製造番号と期間を指定し、[検索]を押します。","③ 목록에서 완제품별 재고량과 검사 결과를 확인합니다.":"③ 一覧で完成品ごとの在庫量と検査結果を確認します。","품목구분·코드·명으로 품목 정보를 조회하고 단위중량·적정/안전재고·롤 정보·실적카운트를 수정합니다.":"品目区分・コード・名称で品目情報を照会し、単位重量・適正/安全在庫・ロール情報・実績カウントを修正します。","① 품목구분·품목코드·품목명을 입력하고 [검색]을 누릅니다.":"① 品目区分・品目コード・品目名を入力し、[検索]を押します。","③ 목록에서 단위중량·적정재고 등 값을 수정하거나 [상세정보수정]을 엽니다.":"③ 一覧で単位重量・適正在庫などの値を修正するか、[詳細情報修正]を開きます。","② 수정한 행을 선택하고 [저장]을 누르거나 [엑셀저장]합니다.":"② 修正した行を選択して[保存]を押すか、[Excel保存]します。","롤CAPA 등 롤 정보는 단위가 R/L인 롤관리 품목만 저장할 수 있습니다.":"ロールCAPAなどのロール情報は、単位がR/Lのロール管理品目のみ保存できます。","칭량실에 보관 중인 원료를 입고 LotNo.·박스(포)번호 단위로 재고량과 제조일자·소비기한을 조회합니다.":"秤量室に保管中の原料を、入庫LotNo.・箱(袋)番号単位で在庫量と製造日・消費期限を照会します。","① 품목구분·품목과 입고 기간을 지정하고 [검색]을 누릅니다.":"① 品目区分・品目と入庫期間を指定し、[検索]を押します。","③ 목록에서 박스(포)별 재고량과 소비기한을 확인합니다.":"③ 一覧で箱(袋)ごとの在庫量と消費期限を確認します。","입고 기간 기본값은 최근 7일이며, 상단에 ERP 마지막 전송일시가 표시됩니다.":"入庫期間の初期値は直近7日間で、上部にERPの最終送信日時が表示されます。","ERP에서 받은 생산오더를 조회하고 공정 생성, 원료 투입공정 지정, 소비기한/생산라인 설정과 제조지시서 출력을 수행합니다.":"ERPから受信した生産オーダーを照会し、工程作成、原料投入工程の指定、消費期限/生産ラインの設定、製造指示書の出力を行います。","① 구분(제조/포장)과 생산계획 기간 등을 지정하고 [검색]을 누릅니다.":"① 区分(製造/包装)と生産計画期間などを指定し、[検索]を押します。","③ 상단 생산오더 목록에서 오더를 선택합니다.":"③ 上部の生産オーダー一覧からオーダーを選択します。","④ [공정확인] 탭에서 공정을 확인 후 [공정생성]을 누릅니다.":"④ [工程確認]タブで工程を確認後、[工程作成]を押します。","④ [원료확인] 탭에서 원료별 투입공정을 지정하고 [투입공정저장]합니다.":"④ [原料確認]タブで原料ごとの投入工程を指定し、[投入工程保存]します。","② [제조지시서]·[칭량원료 다운로드]로 지시서와 원료 목록을 받습니다.":"② [製造指示書]・[秤量原料ダウンロード]で指示書と原料一覧を取得します。","[작업상태초기화]·[소비기한/생산라인설정]은 오더가 진행 상태일 때만 표시됩니다.":"[作業状態初期化]・[消費期限/生産ライン設定]は、オーダーが進行中の場合のみ表示されます。","구분이 '포장'이면 하단에 합포장 그리드와 [추가]·[삭제]·[저장]이 표시됩니다.":"区分が「包装」の場合、下部に合包装グリッドと[追加]・[削除]・[保存]が表示されます。","분말 생산오더를 검색해 설비 CAPA에 맞게 배치를 분할·생성·확정하고 배치별 원료 투입량을 확인합니다.":"粉末の生産オーダーを検索し、設備CAPAに合わせてバッチを分割・作成・確定し、バッチごとの原料投入量を確認します。","① [검색]을 눌러 팝업에서 분말 생산오더를 선택합니다.":"① [検索]を押し、ポップアップで粉末の生産オーダーを選択します。","② 오더 정보에서 소비기한·생산라인을 지정하고 [수정]을 누릅니다.":"② オーダー情報で消費期限・生産ラインを指定し、[修正]を押します。","③ 공정별 대상설비·CAPA를 입력하고 [분할수정]·[배치생성]을 누릅니다.":"③ 工程ごとの対象設備・CAPAを入力し、[分割修正]・[バッチ作成]を押します。","④ 배치를 확인 후 [배치확정]하고 [칭량/해포지시서]를 출력합니다.":"④ バッチを確認後[バッチ確定]し、[秤量/開梱指示書]を出力します。","CAPA는 0이 아닌 값을 입력해야 하며, 대상설비가 비어 있으면 배치를 생성할 수 없습니다.":"CAPAには0以外の値を入力する必要があり、対象設備が空の場合はバッチを作成できません。","배치를 선택하면 하단에 배치별 원료 투입비율·투입량이 표시됩니다.":"バッチを選択すると、下部にバッチごとの原料投入比率・投入量が表示されます。","연질 생산오더를 검색해 설비 CAPA에 맞게 배치를 분할·생성·확정하고 배치별 원료 투입량을 확인합니다. 연질 전용으로 원료별 배치합·오류량을 함께 보여줍니다.":"ソフトカプセルの生産オーダーを検索し、設備CAPAに合わせてバッチを分割・作成・確定し、バッチごとの原料投入量を確認します。ソフトカプセル専用として、原料ごとのバッチ合計・誤差量も表示します。","① [검색]을 눌러 팝업에서 연질 생산오더를 선택합니다.":"① [検索]を押し、ポップアップでソフトカプセルの生産オーダーを選択します。","제조번호·오더번호·기간별로 생산오더의 설비별 배치 현황을 조회하고 배치별 BOM 기준 원료 배치량을 확인합니다.":"製造番号・オーダー番号・期間別に生産オーダーの設備別バッチ状況を照会し、バッチごとのBOM基準原料バッチ量を確認します。","① 제조번호·오더번호와 기간을 지정하고 [검색]을 누릅니다.":"① 製造番号・オーダー番号と期間を指定し、[検索]を押します。","③ 상단 배치현황에서 배치를 선택합니다.":"③ 上部のバッチ状況でバッチを選択します。","④ 하단 BOM 기준에서 원료별 지시량·배치량을 확인합니다.":"④ 下部のBOM基準で原料ごとの指示量・バッチ量を確認します。","② 각 목록의 [엑셀저장]으로 저장합니다.":"② 各一覧の[Excel保存]で保存します。","생산·사용 제조번호별 용기 바코드의 발행 여부, 용량, 사용량과 사용 여부를 조회하고 바코드를 출력합니다.":"生産・使用製造番号ごとに容器バーコードの発行有無、容量、使用量、使用有無を照会し、バーコードを出力します。","① 제조번호·품목코드·생산기간을 지정하고 [검색]을 누릅니다.":"① 製造番号・品目コード・生産期間を指定し、[検索]を押します。","③ 목록에서 용기별 바코드와 사용 현황을 확인하고 출력할 행을 선택합니다.":"③ 一覧で容器ごとのバーコードと使用状況を確認し、出力する行を選択します。","② [바코드 출력]으로 라벨을 출력하거나 [엑셀저장]합니다.":"② [バーコード出力]でラベルを出力するか、[Excel保存]します。","바코드 출력은 현장 단말에서만 가능합니다.":"バーコード出力は現場端末でのみ可能です。","배치별 원료 칭량 작업을 수행합니다. 원료 바코드를 리딩해 입고Lot별 사용량을 전자저울로 계량·저장하고 칭량을 완료합니다.":"バッチごとの原料秤量作業を行います。原料バーコードを読み取り、入庫Lotごとの使用量を電子天秤で計量・保存して秤量を完了します。","① 제조번호 등을 지정해 [검색]하거나 [바코드 스캔]으로 배치를 찾습니다.":"① 製造番号などを指定して[検索]するか、[バーコードスキャン]でバッチを探します。","③ 상단 목록에서 칭량할 배치를 선택합니다.":"③ 上部の一覧から秤量するバッチを選択します。","④ 전자저울을 선택하고 [바코드 리딩]으로 원료 Lot 사용량을 계량합니다.":"④ 電子天秤を選択し、[バーコード読取]で原料Lotの使用量を計量します。","② [저장] 후 [칭량완료]를 누르고 필요 시 [바코드 출력]합니다.":"② [保存]後に[秤量完了]を押し、必要に応じて[バーコード出力]します。","칭량완료 시 전체 지시량 합계와 전체 투입량 합계가 같아야 합니다.":"秤量完了時は、指示量の合計と投入量の合計が一致している必要があります。","액상 제품의 배치별 공정 작업을 POP로 진행합니다. 온·습도 입력, 공정 시작·대기·종료, 작업공수·생산실적·사용설비를 등록합니다.":"液状製品のバッチごとの工程作業をPOPで進めます。温湿度入力、工程の開始・待機・終了、作業工数・生産実績・使用設備を登録します。","① 제조번호·배치번호·기간을 지정하고 [검색]을 누릅니다.":"① 製造番号・バッチ番号・期間を指定し、[検索]を押します。","③ 목록에서 배치·공정을 선택하고 [pop 리딩]으로 POP를 연결합니다.":"③ 一覧でバッチ・工程を選択し、[POP読取]でPOPを接続します。","④ 온도·습도를 입력하고 [공정시작]을 누릅니다(중단 시 [공정대기]).":"④ 温度・湿度を入力し、[工程開始]を押します(中断時は[工程待機])。","④ [작업공수]·[생산실적]·[사용설비]를 등록하고 [작업 종료]합니다.":"④ [作業工数]・[生産実績]・[使用設備]を登録し、[作業終了]します。","온도·습도를 입력해야 공정을 시작할 수 있습니다.":"温度・湿度を入力しないと工程を開始できません。","작업공수·생산실적 등은 공정 시작 후에 등록할 수 있습니다.":"作業工数・生産実績などは工程開始後に登録できます。","연질캡슐 공정(피막물조제·내용물제조·성형·선별·PTP 등)을 POP로 진행하며 설비·점검사항·공정검사·생산실적을 등록합니다.":"ソフトカプセル工程(皮膜液調製・内容物製造・成形・選別・PTPなど)をPOPで進め、設備・点検事項・工程検査・生産実績を登録します。","① [공정검색팝업]이나 [바코드태깅]으로 제조지시번호_배치번호 공정을 선택합니다.":"① [工程検索ポップアップ]または[バーコードタギング]で製造指示番号_バッチ番号の工程を選択します。","② [pop 리딩] 또는 연결POP로 POP 설비를 연결합니다.":"② [POP読取]または連携POPでPOP設備を接続します。","③ 온도·습도를 입력하고 [설비]·[점검사항]을 등록한 뒤 공정을 시작합니다.":"③ 温度・湿度を入力し、[設備]・[点検事項]を登録してから工程を開始します。","③ [작업공수]·[생산실적]을 등록하고 [작업 종료]를 누릅니다.":"③ [作業工数]・[生産実績]を登録し、[作業終了]を押します。","공정별로 [설비] 버튼이 해당 공정 설비 팝업(조제탱크·성형기·선별기 등)을 엽니다.":"工程ごとに、[設備]ボタンで該当工程の設備ポップアップ(調製タンク・成形機・選別機など)が開きます。","[공정검사]는 기록서 대상 공정일 때, [부자재투입]은 부자재 투입 공정일 때만 표시됩니다.":"[工程検査]は記録書対象工程の場合のみ、[副資材投入]は副資材投入工程の場合のみ表示されます。","제조번호·배치번호별로 등록된 공정실적과 작업공수(작업자·투입시간·공수)를 조회하고 수정합니다.":"製造番号・バッチ番号ごとに登録された工程実績と作業工数(作業者・投入時間・工数)を照会・修正します。","① 제조번호·배치번호를 입력하고 [검색]을 누릅니다.":"① 製造番号・バッチ番号を入力し、[検索]を押します。","③ 공정실적 목록에서 행을 선택하고 [수정]으로 실적을 고칩니다.":"③ 工程実績一覧で行を選択し、[修正]で実績を修正します。","④ 하단 작업공수에서 시간·공수를 수정하고 [저장]을 누릅니다.":"④ 下部の作業工数で時間・工数を修正し、[保存]を押します。","지시기간·처리상태별 계획대비 생산실적을 조회해 생산승인 또는 승인취소하고, 배치별·설비별 실적과 수율을 확인합니다.":"指示期間・処理状態別に計画対比生産実績を照会して生産承認または承認取消を行い、バッチ別・設備別の実績と収率を確認します。","① 지시 기간·처리상태 등을 지정하고 [검색]을 누릅니다.":"① 指示期間・処理状態などを指定し、[検索]を押します。","③ 계획대비 생산실적에서 항목을 선택하고 필요 시 [수정]합니다.":"③ 計画対比生産実績で項目を選択し、必要に応じて[修正]します。","② [생산승인] 또는 [승인취소]로 실적을 마감·취소합니다.":"② [生産承認]または[承認取消]で実績を締め・取消します。","④ 하단에서 배치별·설비별 실적과 혼합·충진 수율을 확인합니다.":"④ 下部でバッチ別・設備別の実績と混合・充填収率を確認します。","[생산승인]은 승인상태가 '대기'나 '취소'일 때만 가능합니다.":"[生産承認]は承認状態が「待機」または「取消」の場合のみ可能です。","[승인취소]는 승인상태가 '승인'일 때만 가능합니다.":"[承認取消]は承認状態が「承認」の場合のみ可能です。","기간·제조지시번호별 생산 현황을 조회하고 행별로 작업시간, 대기시간 상세, 작업자/생산실적, 설비정보를 확인합니다.":"期間・製造指示番号別の生産状況を照会し、行ごとに作業時間、待機時間詳細、作業者/生産実績、設備情報を確認します。","① 기간과 제조지시번호를 지정하고 [검색]을 누릅니다.":"① 期間と製造指示番号を指定し、[検索]を押します。","③ 목록 행의 [작업시간확인]·[대기시간 상세확인] 버튼으로 상세를 봅니다.":"③ 一覧の行の[作業時間確認]・[待機時間詳細確認]ボタンで詳細を確認します。","③ [작업자/생산실적 확인]·[설비정보확인]으로 실적과 설비를 확인합니다.":"③ [作業者/生産実績確認]・[設備情報確認]で実績と設備を確認します。","기간별 제품의 계획·생산·출고 수량(SET/Kg)과 수율, 월누계 실적과 전산재고를 조회합니다.":"期間別に製品の計画・生産・出荷数量(SET/Kg)と収率、月累計実績、システム在庫を照会します。","① 시작일~종료일을 지정하고 [검색]을 누릅니다.":"① 開始日〜終了日を指定し、[検索]を押します。","③ 목록에서 제품별 계획·생산·출고 실적과 수율을 확인합니다.":"③ 一覧で製品ごとの計画・生産・出荷実績と収率を確認します。","년도·제품별로 월별 생산대비 양품율을 차트로, 월별 부적합 현황을 표로 보여줍니다.":"年度・製品別に、月別の生産対比良品率をチャートで、月別の不適合状況を表で表示します。","① 년도와 제품명을 지정하고 [검색]을 누릅니다.":"① 年度と製品名を指定し、[検索]を押します。","③ 상단 차트에서 월별 생산대비 양품율 추이를 확인합니다.":"③ 上部のチャートで月別の生産対比良品率の推移を確認します。","④ 하단 표에서 월별 부적합 수량과 누계·평균을 확인합니다.":"④ 下部の表で月別の不適合数量と累計・平均を確認します。","년도와 제품명을 모두 입력해야 조회됩니다.":"年度と製品名の両方を入力しないと照会できません。","생산오더번호·제조번호·기간으로 LOT 이력을 조회하고 자재추적, 실적확인, 검사성적을 확인합니다.":"生産オーダー番号・製造番号・期間でLOT履歴を照会し、資材追跡、実績確認、検査成績を確認します。","① 생산오더번호·제조번호·기간을 지정하고 [검색]을 누릅니다.":"① 生産オーダー番号・製造番号・期間を指定し、[検索]を押します。","③ 목록에서 추적할 LOT 행을 선택합니다.":"③ 一覧で追跡するLOTの行を選択します。","② [자재추적]·[실적확인]·[검사성적확인]으로 이력을 확인합니다.":"② [資材追跡]・[実績確認]・[検査成績確認]で履歴を確認します。","생산유형별 공정 구성(공정명·공장·실적등록/QC 필수·최종공정·배치여부·ERP 공정 등)과 공정준비사항·설비설정을 관리합니다.":"生産タイプ別の工程構成(工程名・工場・実績登録/QC必須・最終工程・バッチ有無・ERP工程など)と工程準備事項・設備設定を管理します。","① 구분(제조/포장)과 분말/액상/연질을 선택하고 [검색]을 누릅니다.":"① 区分(製造/包装)と粉末/液状/ソフトカプセルを選択し、[検索]を押します。","③ 좌측 생산유형 목록에서 유형을 선택합니다.":"③ 左側の  [확인]할 수 없습니다.":"出荷依頼されていない件や既に確認済みの件は[確認]できません。","수입검사가 완료된 구매 상품을 조회하고, 제조번호·접수수량·소비기한을 입력해 입고접수합니다.":"受入検査が完了した購買商品を照会し、製造番号・受付数量・消費期限を入力して入庫受付します。","① 구매오더·수입검사 기간과 상태 등을 지정하고 [검색]을 누릅니다.":"① 購買オーダー・受入検査期間と状態などを指定し、[検索]を押します。","③ 상단 목록에서 검사완료된 구매오더 라인을 선택합니다.":"③ 上段の一覧から検査完了の購買オーダーラインを選択します。","④ 하단에서 [추가] 후 제조번호·접수수량 등을 입력하고 [저장]합니다.":"④ 下段で[追加]後、製造番号・受付数量などを入力して[保存]します。","④ 잘못 접수한 행은 선택 후 [삭제]합니다.":"④ 誤って受け付けた行は選択後に[削除]します。","상태 기본값은 검사완료이며, 검사완료된 상품만 입고접수할 수 있습니다.":"状態の既定値は検査完了で、検査完了した商品のみ入庫受付できます。","제조번호는 필수, 접수수량은 0보다 커야 하며 입고생성 완료 건은 삭제할 수 없습니다.":"製造番号は必須、受付数量は0より大きくする必要があり、入庫生成済みの件は削除できません。","상품 입고접수 내역을 조회하고, 입고일자를 지정해 입고를 생성(확정)하거나 취소합니다.":"商品入庫受付内容を照会し、入庫日付を指定して入庫を生成(確定)または取消します。","① 접수 기간·공급업체·처리상태 등을 지정하고 [검색]을 누릅니다.":"① 受付期間・仕入先・処理状態などを指定し、[検索]を押します。","③ 목록에서 입고할 접수 건을 하나 이상 선택합니다.":"③ 一覧から入庫する受付の件を1件以上選択します。","② 입고일자를 지정하고 [입고생성]을 누릅니다.":"② 入庫日付を指定し、[入庫生成]を押します。","② 입고된 건을 취소하려면 선택 후 [입고취소]를 누릅니다.":"② 入庫済みの件を取り消すには、選択後に[入庫取消]を押します。","접수 기간 기본값은 최근 7일입니다.":"受付期間の既定値は直近7日です。","이미 입고된 건이나 제조번호가 빈 건은 입고생성할 수 없습니다.":"既に入庫済みの件や製造番号が空欄の件は入庫生成できません。","LIMS 연동 버전으로, LIMS 수입검사 승인된 구매 상품을 조회해 제조번호·접수수량을 입력하고 입고접수합니다.":"LIMS連携版で、LIMS受入検査で承認された購買商品を照会し、製造番号・受付数量を入力して入庫受付します。","③ 상단 목록에서 승인완료된 구매오더 라인을 선택합니다.":"③ 上段の一覧から承認完了の購買オーダーラインを選択します。","수입검사 기간 기본값은 최근 60일이며, 승인된 상품만 접수할 수 있습니다.":"受入検査期間の既定値は直近60日で、承認された商品のみ受け付けできます。","취소요청 건은 추가할 수 없고, 입고생성 완료 건은 수정·삭제할 수 없습니다.":"取消要求の件は追加できず、入庫生成済みの件は修正・削除できません。","LIMS 연동 버전으로, 상품 입고접수 내역을 입고생성·취소하고 ERP 전송상태를 함께 확인합니다.":"LIMS連携版で、商品入庫受付内容を入庫生成・取消し、ERP送信状態も併せて確認します。","③ 목록에서 입고할 접수 건을 선택하고 전송상태를 확인합니다.":"③ 一覧から入庫する受付の件を選択し、送信状態を確認します。","② 입고일자를 지정하고 [입고생성]을 눌러 확인창에서 승인합니다.":"② 入庫日付を指定して[入庫生成]を押し、確認画面で承認します。","② 입고된 건은 [입고취소]로 취소합니다.":"② 入庫済みの件は[入庫取消]で取り消します。","입고생성·입고취소 내역은 ERP로 전송되며, 인터페이스 데이터는 5분 간격으로 전송됩니다.":"入庫生成・入庫取消の内容はERPへ送信され、インターフェースデータは5分間隔で送信されます。","LIMS 출하검사 승인된 OEM 제품을 조회해 제조번호·접수수량·소비기한을 입력하고 입고접수합니다.":"LIMS出荷検査で承認されたOEM製品を照会し、製造番号・受付数量・消費期限を入力して入庫受付します。","① 가입고·수입검사 기간과 제조LOT번호 등을 지정하고 [검색]을 누릅니다.":"① 仮入庫・受入検査期間と製造LOT番号などを指定し、[検索]を押します。","③ 상단 목록에서 승인완료된 OEM 입고 건을 선택합니다.":"③ 上段の一覧から承認完了のOEM入庫の件を選択します。","수입검사 기간 기본값은 최근 60일, 품목그룹 기본값은 제품(OEM)입니다.":"受入検査期間の既定値は直近60日、品目グループの既定値は製品(OEM)です。","승인된 건만 접수할 수 있고, 입고생성 완료 건은 수정·삭제할 수 없습니다.":"承認された件のみ受け付けでき、入庫生成済みの件は修正・削除できません。","OEM 제품 입고접수 내역을 조회해 입고를 생성(확정)하거나 취소하고 ERP 전송상태를 확인합니다.":"OEM製品入庫受付内容を照会し、入庫を生成(確定)または取消し、ERP送信状態を確認します。","① 접수 기간·LOT NO·제조업체·처리상태를 지정하고 [검색]을 누릅니다.":"① 受付期間・LOT NO・製造業者・処理状態を指定し、[検索]を押します。","공장·부서·자산유형별 설비 기본정보(자산번호, 취득·잔존가액, 설치위치 등)를 등록·수정·삭제하고 설비 바코드를 출력합니다.":"工場・部署・資産タイプ別の設備基本情報(資産番号、取得・残存価額、設置場所など)を登録・修正・削除し、設備バーコードを出力します。","① 공장·자산유형·설치위치 등 조건을 지정하고 [검색]을 누릅니다.":"① 工場・資産タイプ・設置場所などの条件を指定し、[検索]を押します。","② [등록]으로 설비 기본·보전·검교정·상세스펙 정보를 입력합니다.":"② [登録]で設備の基本・保全・検校正・詳細スペック情報を入力します。","③ 목록에서 설비를 선택해 [수정]·[삭제]·[바코드 출력]을 실행합니다.":"③ 一覧から設備を選択し、[修正]・[削除]・[バーコード出力]を実行します。","③ [상세스펙] 버튼을 누르면 설비 상세정보를 조회 전용으로 봅니다.":"③ [詳細スペック]ボタンを押すと、設備の詳細情報を照会専用で表示します。","바코드 출력은 바코드 프린터가 연결된 단말에서만 가능하며, 여러 설비를 선택해 출력할 수 있습니다.":"バーコード出力はバーコードプリンターが接続された端末でのみ可能で、複数の設備を選択して出力できます。","삭제 시 확인 창이 표시되며, 선택한 첫 번째 행이 삭제됩니다.":"削除時は確認画面が表示され、選択した最初の行が削除されます。","설비 소모품의 유형·번호·사용용도·공정·적정재고 등 기준정보를 등록·수정·삭제합니다.":"設備消耗品のタイプ・番号・使用用途・工程・適正在庫などの基準情報を登録・修正・削除します。","① 공장·소모품 유형·담당부서를 지정하고 [검색]을 누릅니다.":"① 工場・消耗品タイプ・担当部署を指定し、[検索]を押します。","② [등록]으로 새 소모품과 적정재고를 입력합니다.":"② [登録]で新しい消耗品と適正在庫を入力します。","③ 목록에서 소모품을 선택해 [수정]·[삭제]합니다.":"③ 一覧から消耗品を選択し、[修正]・[削除]します。","③ [상세스펙보기]로 소모품 상세정보를 확인합니다.":"③ [詳細スペック表示]で消耗品の詳細情報を確認します。","삭제 시 확인 창이 표시됩니다.":"削除時は確認画面が表示されます。","설비 고장 발생 요청과 조치 결과(처리자, 조치내용, 수리비용, 사용부품)를 등록하고 이력을 조회합니다.":"設備故障の発生要求と措置結果(処理者、措置内容、修理費用、使用部品)を登録し、履歴を照会します。","① 자산번호·요청자·처리자·고장발생 기간을 지정하고 [검색]을 누릅니다.":"① 資産番号・要求者・処理者・故障発生期間を指定し、[検索]を押します。","② [등록]으로 고장 발생 내용을 입력합니다.":"② [登録]で故障発生内容を入力します。","③ 목록에서 고장 건을 선택해 [수정]으로 조치 결과를 입력합니다.":"③ 一覧から故障の件を選択し、[修正]で措置結果を入力します。","② 잘못 등록한 건은 선택 후 [삭제]합니다.":"② 誤って登録した件は選択後に[削除]します。","설비 이력 중 '설비고장' 유형만 조회됩니다(설비보전관리와 같은 이력 테이블 사용).":"設備履歴のうち「設備故障」タイプのみ照会されます(設備保全管理と同じ履歴テーブルを使用)。","설비의 점검주기·점검기준일에 따른 보전 작업 대상과 처리   if (/칭량상태|공정상태|처리상태/.test(c)) return B(STATUS.proc);
  if (/(사용|노출|분할|배치|발행|실적등록|QC|바코드출력)(여부|유무)/.test(c)) return B(STATUS.yn);
  if (c==='상태') return B(/품질|검사/.test(menu)?STATUS.insp:/결재/.test(menu)?STATUS.appr:/설비/.test(menu)?STATUS.equip:/물류|자재/.test(menu)?STATUS.recv:STATUS.order);
  if (/상세보기|상세스펙보기|기록서확인|^등록\(/.test(c)) return {v:col.replace(/\(.*\)/,'')||'보기', act:true, cls:'c'};
  if (c==='점검값') return {v:pick(r,['적합','적합','적합','부적합','해당없음']), sel:['적합','부적합','해당없음']};
  if (c==='색상선택') return {v:pick(r,['#38BDF8','#34D399','#FBBF24','#A78BFA','#FB7185']), sw:true, cls:'c'};
  if (c==='제품이미지') return C('이미지');
  if (/일시|시각$/.test(c)) { const d=addD(TODAY,dt); return C(`${ds(d)} ${pad(int(r,7,18))}:${pad(int(r,0,59))}`); }

  if (/소비기한|유통기한|만료일|기한/.test(c)) return C(ds(addD(TODAY,int(r,180,900))));

  if (/사용용도/.test(c)) return {v:pick(r,['정기 교체','고장 수리','예방 보전'])};
  if (/결재문서명|^제목$/.test(c)) return {v:pick(r,['제조기록서 승인 요청','공정검사 결과 보고','원료 기타출고 요청','설비 보전 결과 보고','출하 승인 요청'])};
  if (/결재라인명/.test(c)) return {v:pick(r,['생산 기본 결재','품질 결재','설비 결재'])};
  if (/점검표명/.test(c)) return {v:pick(r,['청정실 일일 점검표','혼합기 사용 전 점검표','포장실 위생 점검표','칭량실 환경 점검표'])};
  if (/점검목록|점검항목/.test(c)) return {v:pick(r,['작업장 청소 상태','차압 기준 충족','설비 이물 확인','저울 영점 확인','온·습도 기준 충족','위생복 착용 확인'])};
  if (/노출명|ERP명/.test(c)) return {v:pick(r,['제조수량','배치량','소비기한','작업일자','투입량'])};
  if (/변경사유/.test(c)) return {v:pick(r,['양식 개정','공정 변경','오기 수정'])};
  if (/비고|특이사항|내용|세부사항|대기시간상세|MES출고상세/.test(c)) return {v:pick(r,D.memo)};
  if (/^POP$/.test(c)) return C(`POP-${pad(int(r,1,24))}`);
  if (/임원|지원팀|공무팀|품질팀|안전보건팀|품질관리팀|협력사|자사/.test(c)) return N(int(r,0,14));
  if (/율|률|%|달성/.test(c)) return {v:(int(r,850,1000)/10).toFixed(1), cls:'n'};
  if (/온도/.test(c)) return {v:(int(r,200,250)/10).toFixed(1)+' ℃', cls:'n'};
  if (/습도/.test(c)) return {v:int(r,35,55)+' %', cls:'n'};
  if (/공수|노무시간|가동시간|작업시간|대기시간|추가시간|누적시각/.test(c)) return N((int(r,5,95)/10).toFixed(1));
  if (/단가|원가/.test(c)) return N(fmt(int(r,8,950)*100));
  if (/금액|공급가액|부가세/.test(c)) return N(fmt(int(r,10,9000)*1000));
  if (/^\d+월$|누계|계획|실적|합계|^계$|입고계|출고계/.test(c)) return N(fmt(int(r,200,9000)*10));
  if (/capa|CAPA|배합비|기준량/.test(c)) return N(/배합비/.test(c)?(int(r,5,400)/10).toFixed(1):fmt(int(r,50,600)));
  if (/^최소값$/.test(c)) return N((int(r,150,200)/10).toFixed(1));
  if (/^최대값$/.test(c)) return N((int(r,250,300)/10).toFixed(1));
  if (/^설정값$|^측정값$/.test(c)) return N((int(r,180,260)/10).toFixed(1));
  if (/수량|량|재고|중량|무게|카운트|인원|건수|정직원|일용직|포$|EA|SET|PACKING/.test(c)) return N(fmt(int(r,1,2400)*(r()<.5?10:1)));
  return {v:pick(r,['-','A','B','정상'])};
}

function field(label, i){

    const a = isM?`${TODAY.getFullYear()}-01`:ds(addD(TODAY,-14)), b = isM?`${TODAY.getFullYear()}-${pad(TODAY.getMonth()+1)}`:ds(addD(TODAY,7));
    return `<label class="fld">${L}<span class="rng"><input class="input" type="${isM?'month':'date'}" value="${a}" ${F} data-r="a"><span>~</span><input class="input" type="${isM?'month':'date'}" value="${b}" ${F} data-r="b"></span></label>`;
  }
  if (/일자$|^생산일자$/.test(label)) return `<label class="fld">${L}<input class="input" type="date" value="${ds(TODAY)}" ${F} data-r="d"></label>`;

function readFilters(root){
  const f = [];
  $$('[data-f]', root).forEach(el => { const v = el.value.trim(); if (!v) return;
    if (el.dataset.r==='t') f.push({type:'text', v});
    else if (el.dataset.r==='s' && v!=='전체' && v!=='합계만') f.push({type:'opt', v, all:[...el.options].map(o=>o.value)}); });

function applyFilters(rows, filters){
  if (!filters || !filters.length) return rows;
  return rows.filter(rw => filters.every(f => {
    const cells = rw.map(x => String(x.v));
    if (f.type==='text') { const q=f.v.toLowerCase(); return cells.some(c => c.toLowerCase().includes(q) || t(c).toLowerCase().includes(q)); }
    if (!rows.some(r2 => r2.some(x => f.all.includes(String(x.v))))) return true; // 이 표에 해당 값을 가진 컬럼이 없으면 조건을 건너뛴다
    return cells.includes(f.v);
  }));
}

/* ---------- 그리드 ---------- */
const CHECK_BTN = /삭제|확정|승인|출력|발행|접수|입고생성|입고취소|결재의뢰|결재취소|마감|완료/;

function cellHTML(x){
  if (x.b) return `<span class="pill p-${TONE[x.v]||x.b}">${esc(t(x.v))}</span>`;
  if (x.act) return `<button type="button" class="btn sm blue" data-act="1">${esc(t(x.v))}</button>`;

  if (x.sw) return `<span class="sw" style="background:${esc(x.v)}"></span>`;
  return esc(t(x.v));
}
function gridPanel(s, gi, key, opts={}){
  const g = s.grids[gi], S = st(s), k = gi+'|'+key;
  const all = gridRows(s, gi, key, opts.n || (gi===0?24:10));
  const panel = document.createElement('section'); panel.className='panel';
  panel.gkey = k; panel.rows = all; panel.gi = gi;
  if (/패널|정보/.test(g.title) && !/목록/.test(g.title)) {
    const r = rng(s.id+gi+key);
    panel.innerHTML = `<header><h2>${esc(t(g.title))}</h2></header><div class="pb"><div class="kvs">${g.cols.map((c,i)=>`<div><span>${esc(t(c))}</span><b>${cellHTML(gen(c,i,r,s))}</b></div>`).join('')}</div></div>`;
    panel.redraw = () => {};
    return panel;
  }
  const ck = opts.check ?? (gi===0 && s.buttons.some(b=>CHECK_BTN.test(b)));
  const draw = () => {
    S.checked[k] ??= new Set();
    const rows = applyFilters(all, gi===0 && !opts.nofilter ? S.filters.list : null);
    const sk = S.sort[k];
    let view = rows.map(rw => ({rw, i: all.indexOf(rw)}));
    if (sk) view.sort((a,b)=>{ const x=String(a.rw[sk.ci].v), y=String(b.rw[sk.ci].v); const d=(/^[\d,.\-\s℃%]+$/.test(x)&&/^[\d,.\-\s℃%]+$/.test(y))?num(x)-num(y):t(x).localeCompare(t(y)); return sk.dir==='asc'?d:-d; });
    const pages = opts.noPage ? 1 : Math.max(1, Math.ceil(view.length/PAGE)); const pg = Math.min(S.page[k]||1, pages); S.page[k]=pg;
    const shown = opts.noPage ? view : view.slice((pg-1)*PAGE, pg*PAGE);
    const numCols = g.cols.map((c,ci)=>all.length>0 && all.every(rw=>rw[ci].num));

      <div class="tablewrap ${gi>0||opts.short?'short':''}">${view.length?`<table class="g"><thead><tr>${ck?'<th class="ck"><input type="checkbox" data-all="1"></th>':''}<th class="rn">#</th>${g.cols.map((c,ci)=>`<th data-ci="${ci}" class="${numCols[ci]?'n':''}">${esc(t(c))}${sk&&sk.ci===ci?`<span class="srt">${sk.dir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
        <tbody>${shown.map(({rw,i},j)=>`<tr data-i="${i}" class="${i===selI?'sel':''}">${ck?`<td class="ck"><input type="checkbox" data-ck="${i}" ${S.checked[k].has(i)?'checked':''}></td>`:''}<td class="rn">${(pg-1)*PAGE+j+1}</td>${rw.map(x=>`<td class="${x.cls||''}">${cellHTML(x)}</td>`).join('')}</tr>`).join('')}</tbody>
        ${hasSum?`<tfoot><tr>${ck?'<td></td>':''}<td class="rn">${t('합계')}</td>${g.cols.map((c,ci)=>numCols[ci]?`<td class="n">${fmt(Math.round(view.reduce((a,{rw})=>a+(num(rw[ci].v)||0),0)*10)/10)}</td>`:'<td></td>').join('')}</tr></tfoot>`:''}</table>`
        :`<div class="empty">${t('조회된 데이터가 없습니다.')}</div>`}</div>
      ${pages<=1?'':`<div class="gfoot"><span>${t('{a}–{b} / {n}건',{a:(pg-1)*PAGE+1,b:Math.min(pg*PAGE,view.length),n:view.length})}</span><div class="pg">${Array.from({length:pages},(_,p)=>`<button type="button" class="${p+1===pg?'on':''}" data-pg="${p+1}">${p+1}</button>`).join('')}</div></div>`}`;
    $$('[data-pg]',panel).forEach(b=>b.onclick=()=>{S.page[k]=+b.dataset.pg;draw();});
    $$('th[data-ci]',panel).forEach(th=>th.onclick=()=>{ const ci=+th.dataset.ci, p=S.sort[k]; S.sort[k]={ci,dir:p&&p.ci===ci&&p.dir==='asc'?'desc':'asc'}; draw(); });
    const allck = $('[data-all]',panel);
    if (allck) allck.onchange = () => $$('[data-ck]',panel).forEach(x=>{ x.checked=allck.checked; (S.checked[k]??=new Set(), allck.checked)?S.checked[k].add(+x.dataset.ck):S.checked[k].delete(+x.dataset.ck); });
    $$('[data-ck]',panel).forEach(x=>x.onchange=()=>{ (S.checked[k]??=new Set(), x.checked)?S.checked[k].add(+x.dataset.ck):S.checked[k].delete(+x.dataset.ck); });
    $$('[data-cellsel]',panel).forEach(x=>x.onchange=()=>{ const tr=x.closest('tr'), td=x.closest('td'); const ci=[...tr.cells].indexOf(td)-(ck?2:1); all[+tr.dataset.i][ci].v=x.value; });
    $('[data-csv]',panel)?.addEventListener('click',()=>csv(s,g,view.map(v=>v.rw)));
    const tb=$('tbody',panel);
    if (tb) tb.onclick = e => {
      const tr=e.target.closest('tr'); if(!tr) return;
      if (e.target.closest('[data-act]')) { S.sel[k]=+tr.dataset.i; detailPopup(s, g, all[+tr.dataset.i], e.target.closest('[data-act]').textContent.trim()); return; }
      if (e.target.closest('input,select')) return;
      S.sel[k]=+tr.dataset.i; $$('tr.sel',tb).forEach(x=>x.classList.remove('sel')); tr.classList.add('sel');
      opts.onSelect && opts.onSelect(+tr.dataset.i);

  panel.redraw = draw;

}
function csv(s, g, rows){

  const body = [g.cols.map(c=>q(t(c))).join(',')].concat(rows.map(rw=>rw.map(x=>q(t(x.v))).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+body],{type:'text/csv;charset=utf-8'}));
  a.download = `${t(s.name)}_${ds(TODAY)}.csv`.replace(/[\\/:*?"<>|]/g,'_'); document.body.appendChild(a); a.click(); a.remove();

/* ---------- 일반 화면 ---------- */
function screen(s){
  const root = document.createElement('div'); root.className='stack';
  root.innerHTML = head(s) + condBar(s) + `<div class="panes stack"></div>`;
  const panes = $('.panes', root), S = st(s), gs = s.grids;
  root.redraw = () => {
    panes.innerHTML='';
    if (!gs.length) { panes.innerHTML = `<section class="panel"><div class="empty">${t('조회 조건을 지정하고 [검색]을 누르세요.')}</div></section>`; return; }
    if (gs.length===2 && s.kind!=='list' && !gs.some(g=>/패널/.test(g.title))) {
      const m = S.sel['0|m'] ?? 0; S.sel['0|m'] = m;
      const master = gridPanel(s, 0, 'm', {onSelect:i=>{ const d=gridPanel(s,1,'d'+i); panes.replaceChild(d, panes.children[1]); }});
      panes.appendChild(master); panes.appendChild(gridPanel(s,1,'d'+m)); root.master=master;
    } else if (gs.length>=3) {
      const wrap=document.createElement('div'); wrap.className='grid2'; gs.forEach((g,gi)=>wrap.appendChild(gridPanel(s,gi,'m',{n:12,short:true}))); panes.appendChild(wrap); root.master=wrap.firstChild;
    } else {
      gs.forEach((g,gi)=>{ const p=gridPanel(s,gi,'m'); panes.appendChild(p); if(!root.master||gi===0) root.master=p; });

}
function wire(root, s){
  $$('[data-help]',root).forEach(b=>b.onclick = () => help(s));
  $$('[data-b]',root).forEach(b => b.onclick = () => action(s, b.dataset.b, root));
  $$('[data-f]',root).forEach(el => { if(el.dataset.r==='t') el.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); action(s,'검색',root); } }; });
}
function selRows(s, root){
  const S = st(s), k = root.master?.gkey; if (!k) return [];
  const set = new Set(S.checked[k] || []); if (!set.size && S.sel[k]!=null && root.master.rows[S.sel[k]]) set.add(S.sel[k]);
  return [...set];
}
function action(s, b, root){
  const S = st(s), m = root.master;
  if (b==='검색' || /새로 고침/.test(b)) {
    S.filters.list = readFilters(root); S.page={}; S.checked={};
    $$('.tablewrap',root).forEach(x=>x.classList.add('loading'));
    setTimeout(()=>{ root.redraw(); toast(t('{s} 조회를 마쳤습니다.',{s:t(s.name)})); }, 280);
    return;
  }
  const pp = matchPopup(s, b);
  if (/엑셀|다운로드/.test(b) && !/업로드|Up|샘플/.test(b) && !pp) { if(m&&m.rows&&s.grids[m.gi]) csv(s, s.grids[m.gi], applyFilters(m.rows, S.filters.list)); else toast(t('내려받을 표가 없습니다.')); return; }
  if (/업로드|Up/.test(b)) { const fp=$('#filepick'); fp.value=''; fp.onchange=()=>{ if(fp.files[0]) toast(t('{f} 파일을 올렸습니다. 검증 후 반영됩니다.',{f:fp.files[0].name})); }; fp.click(); return; }
  if (/샘플/.test(b)) { csv(s, s.grids[0]||{cols:['품목명','수량','비고']}, []); return; }
  if (pp) return popup(s, pp, root);
  if (/삭제/.test(b)) { const rs=selRows(s,root); if(!m||!rs.length) return toast(t('삭제할 행을 먼저 선택하세요.'));
    return confirmBox(t('선택한 {n}건을 삭제할까요?',{n:rs.length}), () => { rs.sort((a,c)=>c-a).forEach(i=>m.rows.splice(i,1)); S.checked={}; delete S.sel[m.gkey]; m.redraw(); toast(t('{n}건을 삭제했습니다.',{n:rs.length})); }); }
  if ((/추가|등록|입력/.test(b) && !/결과|검사|실적등록|접수|출근/.test(b)) || /^등록\(/.test(b)) return editPopup(s, root, null, b);
  if (/^수정|분할수정/.test(b)) { const rs=selRows(s,root); if(!m||!rs.length) return toast(t('수정할 행을 먼저 선택하세요.')); return editPopup(s, root, rs[0], b); }
  if (/확정|승인|마감|결재|접수|완료|입고생성|입고취소|생성|작업 종료|공정시작|초기화|전송|해제/.test(b)) {
    const rs=selRows(s,root);
    return confirmBox(t('[{b}] 처리할까요?',{b:t(b)}) + (rs.length?' '+t('(선택 {n}건)',{n:rs.length}):''), () => {
      if (m && m.rows && rs.length) { const ci = s.grids[m.gi].cols.findIndex((c,i)=>m.rows[0]?.[i]?.b); if (ci>=0) { rs.forEach(i=>{ const x=m.rows[i][ci]; x.v = /취소|초기화|해제/.test(b) ? (PREV[x.v]||x.v) : (NEXT[x.v]||x.v); }); m.redraw(); } }
      toast(t('[{b}] 처리를 마쳤습니다.',{b:t(b)}));
    });
  }
  if (/저장/.test(b)) { toast(t('저장했습니다.')); return; }
  if (/출력|인쇄|지시서|기록서|바코드/.test(b)) return docPopup(s, b);
  if (/나가기/.test(b)) return closeTab();
  return genericPopup(s, b);
}
function matchPopup(s, b){
  const p = s.popups || [];
  const cl = x => x.replace(/[\s()·/]/g,'');
  return p.find(x => cl(x)===cl(b)) || p.find(x => cl(x).length>1 && cl(b).length>1 && (cl(x).includes(cl(b)) || cl(b).includes(cl(x))));
}

const PAL = ['#38BDF8','#34D399','#FBBF24','#A78BFA','#FB7185','#22D3EE'];
function chart({cats, series, h=240, yMax}){
  const W=640, H=h, L=46, R=series.some(s=>s.axis==='r')?40:12, T=12, B=28;
  const bars=series.filter(s=>s.type!=='line'), lines=series.filter(s=>s.type==='line');
  const lmax = yMax || Math.max(1,...bars.flatMap(s=>s.values),...lines.filter(s=>s.axis!=='r').flatMap(s=>s.values))*1.15;
  const p=Math.pow(10,Math.floor(Math.log10(lmax))); const ym=yMax||Math.ceil(lmax/p)*p;
  const x0=i=>L+(W-L-R)*(i+.5)/cats.length, yL=v=>T+(H-T-B)*(1-v/ym), yR=v=>T+(H-T-B)*(1-v/110);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">`;
  for(let k=0;k<=4;k++){const y=T+(H-T-B)*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid-c)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(Math.round(ym*(1-k/4)))}</text>`;if(R>20)s+=`<text x="${W-R+6}" y="${y+4}">${Math.round(110*(1-k/4))}%</text>`}
  const bw=(W-L-R)/cats.length*.66/Math.max(1,bars.length);
  cats.forEach((c,i)=>{s+=`<text x="${x0(i)}" y="${H-8}" text-anchor="middle">${esc(t(c)).slice(0,14)}</text>`;
    bars.forEach((b,bi)=>{const v=b.values[i],col=b.color||PAL[bi],x=x0(i)-bw*bars.length/2+bw*bi;s+=`<rect x="${x+1.5}" y="${yL(v)}" width="${Math.max(2,bw-3)}" height="${yL(0)-yL(v)}" fill="${col}" rx="3" opacity=".9"><title>${esc(t(b.name))} ${fmt(v)}</title></rect>`})});
  lines.forEach((ln,li)=>{const f=ln.axis==='r'?yR:yL,col=ln.color||PAL[(bars.length+li)%PAL.length];s+=`<polyline fill="none" stroke="${col}" stroke-width="2.2" points="${ln.values.map((v,i)=>`${x0(i)},${f(v)}`).join(' ')}"/>`;ln.values.forEach((v,i)=>{s+=`<circle cx="${x0(i)}" cy="${f(v)}" r="3.2" fill="var(--surface)" stroke="${col}" stroke-width="2"><title>${esc(t(ln.name))} ${v}</title></circle>`})});
  s+='</svg>';
  return `<div class="legend">${series.map(x=>{const col=x.color||(x.type==='line'?PAL[(bars.length+lines.indexOf(x))%PAL.length]:PAL[bars.indexOf(x)]);return `<span><i style="background:${col}"></i>${esc(t(x.name))}</span>`}).join('')}</div>${s}`;
}
function ring(v, label, color){ const r=38,C=2*Math.PI*r; return `<div style="text-align:center"><svg width="96" height="96" viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" stroke="var(--surface3)" stroke-width="10" fill="none"/><circle cx="50" cy="50" r="${r}" stroke="${color}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)">${v}%</text></svg><div style="font-size:12px;color:var(--muted)">${t(label)}</div></div>`; }
function donut(parts){ const tot=parts.reduce((a,p)=>a+p[1],0); let acc=0; const r=60,C=2*Math.PI*r;
  return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center"><svg width="180" height="180">${parts.map((p,i)=>{const len=C*p[1]/tot;const s=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${PAL[i]}" stroke-width="24" stroke-dasharray="${len} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 90 90)"/>`;acc+=len;return s}).join('')}<text x="90" y="86" text-anchor="middle" font-size="12" fill="var(--muted)">${t('금월 생산')}</text><text x="90" y="108" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)">1,248 t</text></svg><div class="legend" style="flex-direction:column;gap:8px">${parts.map((p,i)=>`<span><i style="background:${PAL[i]}"></i>${t(p[0])} ${p[1]}%</span>`).join('')}</div></div>`; }
const ser=(seed,n,a,b)=>{const r=rng(seed);return Array.from({length:n},()=>int(r,a,b))};
